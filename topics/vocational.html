);border:1px solid #f2c7c0}.alert.red b{color:var(--red)}\n  .alert.amber{background:var(--amber-bg);border:1px solid #eed9ae}.alert.amber b{color:var(--amber)}\n  .alert.green{background:var(--green-bg);border:1px solid #bfe3cf}.alert.green b{color:var(--green)}\n  .alert.blue{background:var(--accent-bg);border:1px solid #c4d9ef}.alert.blue b{color:var(--accent)}\n  .alert.purple{background:var(--purple-bg);border:1px solid #d6c7f0}.alert.purple b{color:var(--purple)}\n  .ev{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:0 6px;border-radius:4px;white-space:nowrap;border:1px solid;margin-left:3px}\n  .ev-a{background:#e8f6ef;color:#1e7e4d;border-color:#bfe3cf}\n  .ev-b{background:#fdf3e3;color:#b7791f;border-color:#eed9ae}\n  .ev-c{background:#f1f3f6;color:#6b7787;border-color:#dde3ea}\n  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px;margin:16px 0}\n  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;position:relative}\n  .kpi .num{font-size:21px;font-weight:700;color:var(--accent);font-family:var(--mono);letter-spacing:-.5px;line-height:1.25}\n  .kpi .num.red{color:var(--red)}\n  .kpi .num.amber{color:var(--amber)}\n  .kpi .lbl{font-size:12.3px;color:var(--ink2);margin-top:4px;line-height:1.5}\n  .kpi .src{font-size:10.8px;color:var(--ink3);margin-top:6px;line-height:1.4}\n  a.ext{color:var(--accent);text-decoration:none;border-bottom:1px dotted #a8c4e0;word-break:break-all}\n  a.ext:hover{background:var(--accent-bg)}\n  a.ext::after{content:\"↗\";font-size:10px;margin-left:2px;opacity:.6}\n  .bars{margin:16px 0}\n  .bar-row{display:grid;grid-template-columns:190px 1fr 130px;gap:12px;align-items:center;margin-bottom:10px;font-size:13px}\n  @media(max-width:760px){.bar-row{grid-template-columns:1fr;gap:4px}.bar-row .bv{text-align:left}}\n  .bar-row .bl{color:#33475f;font-weight:600;text-align:right}\n  @media(max-width:760px){.bar-row .bl{text-align:left}}\n  .bar-track{background:#eef2f7;border-radius:6px;height:26px;position:relative;overflow:hidden}\n  .bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:9px;font-size:11.8px;color:#fff;font-family:var(--mono);white-space:nowrap}\n  .bv{font-family:var(--mono);font-size:12.5px;color:var(--ink2);text-align:right}\n  ul.tight,ol.tight{padding-left:22px;font-size:13.8px}\n  ul.tight li,ol.tight li{margin-bottom:7px}\n  .quote{background:#fbfcfd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0;font-size:13.2px;line-height:1.8;color:#2c3b4e}\n  .quote b{color:#14324f}\n  .quote .en{font-family:var(--mono);font-size:11.6px;color:#6b7787;display:block;margin-bottom:5px;line-height:1.6}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:14px 0}\n  @media(max-width:860px){.grid2{grid-template-columns:1fr}}\n  .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:13.4px;line-height:1.75}\n  .box h4{margin:0 0 8px;font-size:14.5px;color:#14324f}\n  .box.ok{border-top:4px solid var(--green)}\n  .box.no{border-top:4px solid var(--red)}\n  .box.warn{border-top:4px solid var(--amber)}\n  .box .tagline{font-size:11.5px;font-family:var(--mono);color:var(--ink3);margin-bottom:8px}\n  .footnote{font-size:12px;color:var(--ink3);margin-top:10px}\n  hr.soft{border:none;border-top:1px dashed var(--line);margin:24px 0}\n  .num-big{font-family:var(--mono);font-weight:700}\n\u003c/style>\n\u003cmeta content=\"noindex,nofollow\" name=\"robots\"/>\u003cstyle>#material-library-bar{all:initial;display:block;position:relative;z-index:10000;background:#f2efe6;color:#293b35;border-bottom:1px solid #b8b9ad;padding:14px 4vw;font:15px/1.65 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}#material-library-bar a{color:#225e4b;text-decoration:underline;margin-right:18px}#material-library-bar .ml-note{display:block;padding:8px 0 0;color:#55462b;font-size:14px}#material-library-bar strong{font-weight:700} @media print{#material-library-bar{display:block!important;position:static!important}}\n/* 资料库手机阅读修正：只约束页面宽度，表格保留局部横向滚动。 */\n@media(max-width:720px){\n  #material-library-bar{box-sizing:border-box;max-width:100%;overflow-wrap:anywhere}\n  body{overflow-wrap:anywhere}\n  .wrap,.panel,.rp,.card,.rp .card,.pcard,.rp .pcard,.ans,.rp .ans,.body,.rp details .body,.scroll,.rp .scroll,nav.tabbar{min-width:0;max-width:100%}\n  .cards,.rp .cards{grid-template-columns:minmax(0,1fr)}\n  .cards>*,.rp .cards>*,.ansbox>*,.rp .ansbox>*{min-width:0}\n  table,.rp table{display:block;width:100%;max-width:100%;overflow-x:auto}\n  .scroll table,.rp .scroll table{display:table;max-width:none}\n  nav.toc a,.rp nav.toc a{white-space:normal;overflow-wrap:anywhere}\n  pre,img,svg,iframe{max-width:100%}\n}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cdiv id=\"material-library-bar\">\u003ca href=\"../index.html\">返回全部材料\u003c/a>\u003ca href=\"../sources.html\">来源明细\u003c/a>\u003cstrong>L52 · 历史原稿 · 含重要纠错\u003c/strong>\u003cspan class=\"ml-note\">重要纠错：940万元是FY2025学校管理收入，不能除以2026年披露的37所学校得出精确单校单价；学校收学生学费；市场服务含校外业务，不能推断后勤利润或软件预算。 \u003ca href=\"C01.html\">职教校正版\u003c/a>\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003cheader class=\"report-head\">\n\u003cdiv class=\"tag\">快速情报简报 · 第一轮 · 供决定是否深挖\u003c/div>\n\u003ch1>职业教育托管这门生意能不能做\u003cbr/>\u003cspan style=\"font-size:19px;opacity:.9\">样本：优蓝国际（NASDAQ: YOUL）· 天坤教育 TOT 模式\u003c/span>\u003c/h1>\n\u003cp class=\"sub\">方法：以优蓝国际的美国 SEC 法定披露（20-F / F-1 / 合同附件）为主证据，辅以政府采购、地方财政决算、教育局公示、国务院督查通报。企业与独立核验全程分列。\u003cb>本简报不含推测——查不到的会写明\"未找到\"。\u003c/b>\u003c/p>\n\u003cdiv class=\"meta\">调研日期 2026-10-14 ｜ 数据截止 2026-10-14 ｜ 一手来源：SEC 20-F(FY2025) / 海兴县合作办学协议 / 教育部·人社部统计公报 / 财政部 102 号令\u003c/div>\n\u003c/header>\n\u003cnav class=\"toc\">\n\u003cb>目录\u003c/b>\n\u003ca href=\"#s0\">一句话结论\u003c/a>\u003ca href=\"#s1\">1 最刺眼的数字\u003c/a>\u003ca href=\"#s2\">2 钱到底从哪来\u003c/a>\u003ca href=\"#s3\">3 根本矛盾\u003c/a>\u003ca href=\"#s4\">4 与K12的差异\u003c/a>\u003ca href=\"#s5\">5 合规：一开口三天花板\u003c/a>\u003ca href=\"#s6\">6 优蓝公司本身\u003c/a>\u003ca href=\"#s7\">7 判断\u003c/a>\u003ca href=\"#s8\">8 缺口与下一步\u003c/a>\u003ca href=\"#s9\">9 信源清单\u003c/a>\n\u003c/nav>\n\u003c!-- ============ 一句话结论 ============ -->\n\u003csection id=\"s0\">\n\u003cdiv class=\"verdict\">\n\u003ch3>一句话结论\u003c/h3>\n\u003cp class=\"big\">\u003cb>职业教育整校托管不是\"缩小版的 K12 托管\"——它是另一门生意，而且政府付费这一头几乎是象征性的。\u003c/b>\u003c/p>\n\u003cp>优蓝托管 \u003cb>37 所\u003c/b>公办中职，一年收到的\u003cb>委托管理费只有 940 万元人民币\u003c/b>，摊到每所校约 \u003cb>25 万元/年\u003c/b>。作为对照，上次调研的 K12 托管单校年费是 \u003cb>100–500 万元\u003c/b>（义乌一个项目就 1975 万/年）。差 10–20 倍。\u003c/p>\n\u003cp>真正在赚钱的是另外两块：\u003cb>专业共建服务费\u003c/b>（向学生收，2,650 万/年，是管理费的 2.8 倍）和\u003cb>校园后勤\u003c/b>（餐饮、宿舍、超市）。而优蓝自己在 20-F 里写得很直白——职教业务的定位是\u003cb>\"为劳务外包业务提供蓝领人才供给、增强客户粘性\"\u003c/b>，也就是\u003cb>人才蓄水池，不是利润中心\u003c/b>。\u003c/p>\n\u003cp>\u003cb>给研究委托方/公司的直接含义：\u003c/b>K12 那条\"把 SaaS 卖给托管方\"的路子，在职教整校托管上\u003cb>大概率走不通——托管方自己都没赚到钱，不会为系统付费\u003c/b>。职教赛道值得看的是\u003cb>专业共建\u003c/b>，那是唯一带\"课程/教学\"属性、且存在真实付费意愿的板块，又恰好不受 K12 那两条红线约束。但它有一个死穴（见 §5）。\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 最刺眼的数字 ============ -->\n\u003csection id=\"s1\">\n\u003ch2 class=\"sec\">1 拿数字说话：政府付费这一头有多大？\u003c/h2>\n\u003cdiv class=\"kpis\">\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num\">37 所\u003c/div>\n\u003cdiv class=\"lbl\">托管公办中职（20-F FY2025 口径）\u003c/div>\n\u003cdiv class=\"src\">SEC 20-F，2026-04-30 提交\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num red\">940 万元\u003c/div>\n\u003cdiv class=\"lbl\">全年委托管理费收入（人民币）\u003c/div>\n\u003cdiv class=\"src\">20-F 业务章节，FY2025\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num red\">≈25 万元/校·年\u003c/div>\n\u003cdiv class=\"lbl\">摊算单校管理费（派生数字）\u003c/div>\n\u003cdiv class=\"src\">940 万 ÷ 37 所，口径见下注\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num amber\">2.43%\u003c/div>\n\u003cdiv class=\"lbl\">职业教育占集团总收入\u003c/div>\n\u003cdiv class=\"src\">20-F FY2025（4,510.8 万元）\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num\">51.0%\u003c/div>\n\u003cdiv class=\"lbl\">职教分部毛利率（四业务中第二高）\u003c/div>\n\u003cdiv class=\"src\">20-F 分部附注 FY2025\u003c/div>\n\u003c/div>\n\u003cdiv class=\"kpi\">\n\u003cdiv class=\"num red\">-72.1%\u003c/div>\n\u003cdiv class=\"lbl\">职教收入 2023→2024 降幅\u003c/div>\n\u003cdiv class=\"src\">20-F MD&amp;A（公司解释见下）\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"card\">\n\u003ch3 style=\"margin-top:0\">政府付费 vs K12 托管：同一件事，差一个数量级\u003c/h3>\n\u003cdiv class=\"bars\">\n\u003cdiv class=\"bar-row\">\n\u003cdiv class=\"bl\">优蓝 · 单校摊算\u003c/div>\n\u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:5%;background:#c0392b\">25 万\u003c/div>\u003c/div>\n\u003cdiv class=\"bv\">25 万元/年\u003c/div>\n\u003c/div>\n\u003cdiv class=\"bar-row\">\n\u003cdiv class=\"bl\">K12 托管 · 区间下限\u003c/div>\n\u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:20%;background:#1f5fa8\">100 万\u003c/div>\u003c/div>\n\u003cdiv class=\"bv\">100 万元/年\u003c/div>\n\u003c/div>\n\u003cdiv class=\"bar-row\">\n\u003cdiv class=\"bl\">K12 托管 · 区间上限\u003c/div>\n\u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:100%;background:#14324f\">500 万\u003c/div>\u003c/div>\n\u003cdiv class=\"bv\">500 万元/年\u003c/div>\n\u003c/div>\n\u003cdiv class=\"bar-row\">\n\u003cdiv class=\"bl\">义乌福田二小（含品牌费）\u003c/div>\n\u003cdiv class=\"bar-track\">\u003cdiv class=\"bar-fill\" style=\"width:100%;background:#6b46c1\">1975 万（超轴）\u003c/div>\u003c/div>\n\u003cdiv class=\"bv\">1975 万元/年\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cp class=\"footnote\">\u003cb>口径说明（必读）：\u003c/b>①前者是\"37 所校合计 940 万 ÷ 37\"的\u003cb>摊算值\u003c/b>，且 20-F 的托管校数与管理费收入\u003cb>未必严格对应同一批学校\u003c/b>，故仅作数量级参照，不可当精确单价引用。②后者来自上次 K12 调研，口径为\"单校年托管费\"，含不含品牌费/激励经费各家不同，同样禁止直接横比。③但即便按最宽松口径，两者的数量级差（10–20 倍）是成立的——这是本简报最稳的结论。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"alert red\">\n\u003cb>为什么职教收入还在掉？\u003c/b>公司自己的解释（20-F MD&amp;A）：职教收入 2023→2024 下降 72.1%，原因是 ①\u003cb>\"智能校园\"一次性项目基本完成\u003c/b>（单项目 400–800 万的 IT/实训设备销售，多数 2023 年做完）；②\u003cb>自营职业学校与职业培训业务被列为终止经营并处置\u003c/b>。也就是说，\u003cb>2023 年那个好看的基数里，一大块是\"卖设备\"和\"卖学校\"，不是托管\u003c/b>。\n  \u003c/div>\n\u003c/section>\n\u003c!-- ============ 钱从哪来 ============ -->\n\u003csection id=\"s2\">\n\u003ch2 class=\"sec\">2 钱到底从哪来：三源拆解\u003c/h2>\n\u003cp style=\"font-size:13.6px;color:var(--ink2)\">这是本轮最有价值的发现——把\"职教托管\"的钱按来源拆开，你会发现钱的分布跟直觉完全相反。\u003c/p>\n\u003cdiv class=\"scroll\">\n\u003ctable>\n\u003cthead>\n\u003ctr>\u003cth>收入来源\u003c/th>\u003cth>谁付钱\u003c/th>\u003cth>2025 年金额（人民币）\u003c/th>\u003cth>计价方式\u003c/th>\u003cth>占比/地位\u003c/th>\u003cth>信源\u003c/th>\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cb>① 委托管理费\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">TOT 主合同\u003c/span>\u003c/td>\n\u003ctd>\u003cb>政府财政\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">经学校公户支付\u003c/span>\u003c/td>\n\u003ctd>\u003cb style=\"color:#c0392b\">940 万元\u003c/b>\u003c/td>\n\u003ctd>\u003cb>按在校生人头\u003c/b>收\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">已核实：500 元/生·学期\u003c/span>\u003c/td>\n\u003ctd>约 21%\u003c/td>\n\u003ctd>\u003cspan class=\"ev ev-a\">一手·20-F\u003c/span>\u003cspan class=\"ev ev-a\">一手·合同\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>② 专业共建服务费\u003c/b>\u003c/td>\n\u003ctd>\u003cb>学生/学校\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">非政府\u003c/span>\u003c/td>\n\u003ctd>\u003cb style=\"color:#1e7e4d\">2,650 万元\u003c/b>\u003c/td>\n\u003ctd>\u003cb>每生每学期 1,600–5,000 元\u003c/b>\u003c/td>\n\u003ctd>\u003cb>约 59%\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">是管理费的 2.8 倍\u003c/span>\u003c/td>\n\u003ctd>\u003cspan class=\"ev ev-a\">一手·20-F\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>③ 校园后勤服务\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">餐饮/宿舍/超市/用品\u003c/span>\u003c/td>\n\u003ctd>\u003cb>学生\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">消费付费\u003c/span>\u003c/td>\n\u003ctd>\u003cb style=\"color:#b7791f\">金额未单列\u003c/b>\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">并入\"市场服务\"7,188 万\u003c/span>\u003c/td>\n\u003ctd>食堂/超市托管经营\u003c/td>\n\u003ctd>与在线零售、员工福利混计，\u003cb>无法拆分\u003c/b>\u003c/td>\n\u003ctd>\u003cspan class=\"ev ev-a\">一手·20-F\u003c/span>\u003cspan class=\"ev ev-a\">一手·决算\u003c/span>\u003c/td>\n\u003c/tr>\n\u003ctr style=\"opacity:.72\">\n\u003ctd>④ \"智能校园\"设备销售\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">非经常性\u003c/span>\u003c/td>\n\u003ctd>学校\u003c/td>\n\u003ctd>—\u003cbr/>\u003cspan style=\"font-size:11.5px;color:#8494a8\">多数已于 2023 完成\u003c/span>\u003c/td>\n\u003ctd>单项目 400–800 万元\u003c/td>\n\u003ctd>一次性，不可持续\u003c/td>\n\u003ctd>\u003cspan class=\"ev ev-a\">一手·20-F\u003c/span>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"alert green\">\n\u003cb>三条可直接引用的结论：\u003c/b>\n\u003cul class=\"tight\" style=\"margin:8px 0 0\">\n\u003cli>\u003cb>政府付费占比只有约 1/5。\u003c/b>\"托管\"这块招牌撑着 37 所学校的规模，但政府那头的钱是零头。\u003cb>这门生意的现金流主体在学生身上，不在财政。\u003c/b>\u003c/li>\n\u003cli>\u003cb>专业共建才是主业。\u003c/b>每生每学期 1,600–5,000 元，2025 年 2,650 万元。它本质是\"把课程/专业打包卖给学校和学生\"，\u003cb>这是唯一带教学属性、且真有付费意愿的板块\u003c/b>。\u003c/li>\n\u003cli>\u003cb>后勤是隐形的大头，但拿不到数字。\u003c/b>优蓝把餐饮/宿舍收入并进了\"市场服务\"（与在线零售、员工福利混在一起），\u003cb>无法单独拆出教育后勤的规模\u003c/b>——这是本行业最大的信息不透明处，也是现场尽调必须撬开的点。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003ch3>一手合同长什么样：海兴县那份（SEC 附件，法定披露文件）\u003c/h3>\n\u003cdiv class=\"card\">\n\u003cp style=\"font-size:13.4px;margin-bottom:10px\">优蓝把\"海兴县职业教育中心合作办学协议\"作为上市申报文件附件提交给了 SEC，所以我能看到合同原文。\u003cb>这份合同解释了为什么在政府采购网上搜不到天坤的项目：\u003c/b>\u003c/p>\n\u003cdiv class=\"quote\">\n\u003cspan class=\"en\">\"…the cooperation mode and the services provided are special, they are not subject to the regulation by the bidding law and government procurement law… do not require any bidding procedures.\"\u003c/span>\n\u003cb>（合同原文）\u003c/b>\"因合作模式与服务具有特殊性，\u003cb>不受招标法与政府采购法约束，乙方提供的管理运营服务无需任何招标程序\u003c/b>。\"\n      \u003cdiv style=\"margin-top:8px;font-size:12.2px;color:#8494a8\">来源：SEC Exhibit 10.12　\u003cspan class=\"ev ev-a\">一手·法定披露合同\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"scroll\" style=\"margin-top:12px\">\n\u003ctable style=\"min-width:820px\">\n\u003cthead>\u003ctr>\u003cth>合同要素\u003c/th>\u003cth>原文要点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>签约主体\u003c/b>\u003c/td>\u003ctd>甲方：海兴县人民政府；乙方：\u003cb>浙江天坤书萱教育科技有限公司\u003c/b>（法定代表人王云雷）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>委托期限\u003c/b>\u003c/td>\u003ctd>\u003cb>20 年\u003c/b>（2023-07-17 至 2043-08-31），每 6 年综合评估一次；期满乙方享同等条件优先权\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>管理费计价\u003c/b>\u003c/td>\u003ctd>\u003cb>按在校生人头\u003c/b>：2023 秋免收 → 2024 春新招生 \u003cb>500 元/生·学期\u003c/b>（存量生 250 元）→ 2024 秋起全部 \u003cb>500 元/生·学期\u003c/b> → 在校生达 1,500 人后降为 \u003cb>400 元/生·学期\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>付款安排\u003c/b>\u003c/td>\u003ctd>上学期费用于每年 \u003cb>3 月 30 日、9 月 30 日前一次性支付\u003c/b>；\u003cb>从学校公户扣除\u003c/b>，汇入乙方在当地设立的运营公司账户\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>治理结构\u003c/b>\u003c/td>\u003ctd>学校管理理事会 5 人（甲方 3 人、乙方 2 人），\u003cb>理事长由甲方任命\u003c/b>，秘书长由乙方任命；\u003cb>重大事项由学校党总支会议决定\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>招生与学籍\u003c/b>\u003c/td>\u003ctd>乙方\u003cb>以公办学校名义\u003c/b>招生、办学、发布招生简章；\u003cb>学籍与毕业证均以公办学校名义办理\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>后勤设施\u003c/b>\u003c/td>\u003ctd>乙方使用学校后勤设备设施，\u003cb>须向甲方/学校支付租赁费\u003c/b>；并须\"填补学校常规运营经费的缺口\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>考核指标\u003c/b>\u003c/td>\u003ctd>设\"品牌层面目标\"等条目，\u003cb>未见升学率/就业率硬性 KPI 明文\u003c/b>（公开文本相关段落被截断，标\"未完整核验\"）\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>退出与交回\u003c/b>\u003c/td>\u003ctd>公开文本中\u003cb>未见\u003c/b>明确的\"期满交回\"或提前终止具体条款 → \u003cb>标为\"未找到\"\u003c/b>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"alert amber\">\n\u003cb>从中能读出三件事：\u003c/b>\n\u003cbr/>① \u003cb>\"以公办学校名义招生、学籍与毕业证走公办\"\u003c/b>——受托方拿到的是\u003cb>运营权\u003c/b>，不是办学主体资格。这跟 K12 托管\"四权整体让渡即无效\"的司法逻辑是同一方向：\u003cb>越是把主体资格留在公办，越安全。\u003c/b>\n\u003cbr/>② \u003cb>理事长（甲方任命）+ 党总支会议决定重大事项\u003c/b>——受托方的决策权被制度性限制。\n      \u003cbr/>③ \u003cb>按人头收费 + 20 年长约\u003c/b>——这个组合意味着受托方的收益\u003cb>完全绑在招生规模上\u003c/b>。第 3 节会说明，这恰恰是最危险的地方。\n    \u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 根本矛盾 ============ -->\n\u003csection id=\"s3\">\n\u003ch2 class=\"sec\">3 根本矛盾：按人头收费的模型，撞上缩量的市场\u003c/h2>\n\u003cp style=\"font-size:13.6px;color:var(--ink2)\">这是我认为整份调研里最值得你知道的一件事——它同时解释了三件事：为什么天坤要不停找新学校、为什么文山市项目会失败、以及为什么\"托管校数\"这个指标本身不可信。\u003c/p>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"box no\">\n\u003cdiv class=\"tagline\">矛盾的一方 · 商业模型\u003c/div>\n\u003ch4>收入完全绑在\"招生人数\"上\u003c/h4>\n\u003cul class=\"tight\" style=\"font-size:13.2px\">\n\u003cli>管理费：\u003cb>500 元/生·学期\u003c/b>（已核实，合同原文）\u003c/li>\n\u003cli>后勤消费（餐饮/宿舍/超市）：\u003cb>按在读人数\u003c/b>产生\u003c/li>\n\u003cli>专业共建：\u003cb>每生每学期 1,600–5,000 元\u003c/b>\u003c/li>\n\u003c/ul>\n\u003cp style=\"margin-top:8px;font-size:13.2px\">三条收入线\u003cb>全部按人头计价\u003c/b>。学生多一个就多一份钱，少一个就少一份。\u003cb>受托方没有定价权，只有\"扩招\"这一条增长路径。\u003c/b>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"box no\">\n\u003cdiv class=\"tagline\">矛盾的另一方 · 市场现实\u003c/div>\n\u003ch4>中职本身在缩量\u003c/h4>\n\u003cul class=\"tight\" style=\"font-size:13.2px\">\n\u003cli>\u003cb>中职招生连年下降（教育部口径·不含技工）\u003c/b>：2021 488.99 → 2022 484.78 → 2023 454.04 → \u003cb>2024 418.33 万\u003c/b>，三年降 14.5%；若算 2019 同口径（457.42 万）→ 2024 降 8.5%\u003cspan class=\"ev ev-a\">一手·教育部 2019-2024 历年统计公报\u003c/span>\u003c/li>\n\u003cli>中职在校生 2023→2024：1,298 万 → \u003cb>1,229 万\u003c/b>（-5.32%）\u003c/li>\n\u003cli>中职学校数 2023→2024：7,085 → \u003cb>6,862 所\u003c/b>（-223 所）\u003c/li>\n\u003cli>职普比\"大体相当\"已实质松动：陕西普高招生占比 69.19%、吉林 73.4%\u003c/li>\n\u003cli>2024 年 9 月全国教育大会后，教育部改提\u003cb>\"少而精的中等职业教育\"\u003c/b>\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"alert red\">\n\u003cb>把两边合起来看：\u003c/b>受托方的商业模型要求\"扩招\"，而它接手的恰恰是\u003cb>一个整体在萎缩、且大多位于中西部县域的学校系统\u003c/b>。这不是经营能力问题，是\u003cb>结构性错配\u003c/b>。\n    \u003cbr/>\u003cbr/>\u003cb>这解释了为什么天坤要不断找新学校（21→29→37 所）而不是把现有学校做深\u003c/b>——因为单校的天花板被学生的自然流失锁死了，只能靠\"多拿几所\"来维持总量增长。\u003cb>这是土地掠夺式的增长，不是效率增长。\u003c/b>\n\u003cbr/>\u003cbr/>\u003cb>也解释了一手失败案例：\u003c/b>文山市职业高级中学，2021-08 由天坤托管 15 年。文山市教体局 2024 年对政协提案的答复里写得非常直白——\"被托管两年有余……\u003cb>办学规模连年下滑，办学成效严重下降\u003c/b>\"。在籍生从 2020 学年 1,832 人降到 2023 学年 1,159 人，招生从 603 人降到 419 人。而合同目标是 2024 年达到 4,000 人，官方明说\"无法达到\"。\u003cspan class=\"ev ev-a\">一手·市教体局答复\u003c/span>\n\u003c/div>\n\u003cdiv class=\"alert amber\">\n\u003cb>对我们的启示（这条比结论更值钱）：\u003c/b>如果你要评估任何一个\"按人头收费的教育服务模型\"，先问一句——\u003cb>生源池是在扩大还是在收缩？\u003c/b>K12 高中段还有人口红利和政策保护（普高扩招），中职段是逆风。\u003cb>同样一份托管合同，签在不同学段，商业价值可以差一个数量级。\u003c/b>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 与K12差异 ============ -->\n\u003csection id=\"s4\">\n\u003ch2 class=\"sec\">4 与 K12 托管的根本差异（对照上次调研）\u003c/h2>\n\u003cdiv class=\"scroll\">\n\u003ctable>\n\u003cthead>\u003ctr>\u003cth>维度\u003c/th>\u003cth>职业教育托管（优蓝/天坤）\u003c/th>\u003cth>K12 初高中托管（天立/海亮/世外）\u003c/th>\u003cth>差异要点\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cb>政府付费能力\u003c/b>\u003c/td>\n\u003ctd>单校摊算 \u003cb>≈25 万元/年\u003c/b>（37 校合计 940 万）\u003c/td>\n\u003ctd>单校 \u003cb>100–500 万元/年\u003c/b>；义乌 1975 万\u003c/td>\n\u003ctd>\u003cb>差 10–20 倍\u003c/b>。→ 决定\"能不能卖 SaaS 给托管方\"\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>政策红线\u003c/b>\u003c/td>\n\u003ctd>\u003cb>无\"协议控制 + 关联交易\"红线\u003c/b>：《民促法实施条例》§13/§45 仅约束义务教育民办校与非营利幼儿园\u003cspan class=\"ev ev-a\">一手·法规\u003c/span>\u003c/td>\n\u003ctd>\u003cb>两条硬红线\u003c/b>：§13 禁协议控制、§45 禁义务教育关联交易、§62 罚则含永久禁入\u003c/td>\n\u003ctd>\u003cb>职教的政策空间明显更宽\u003c/b>——这是真实的政策套利空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>决策权天花板\u003c/b>\u003c/td>\n\u003ctd>\u003cb>党组织领导的校长负责制\u003c/b>：公办校重大事项由党委/党总支决定，受托方只有管理经营权\u003cspan class=\"ev ev-a\">一手·职教法§35\u003c/span>\u003c/td>\n\u003ctd>\"四权整体让渡即无效\"（司法判准），但合同层面授权尺度差异大\u003c/td>\n\u003ctd>职教的限制\u003cb>写在法律里且更硬\u003c/b>，不经合同谈判空间绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>市场趋势\u003c/b>\u003c/td>\n\u003ctd>\u003cb>缩量\u003c/b>：中职招生 2019→2024 约 -30%，职普比松动\u003c/td>\n\u003ctd>\u003cb>有保护\u003c/b>：普高招生与在校生同步增长（2024 普高招生 1,036 万）\u003c/td>\n\u003ctd>职教是\u003cb>逆风赛道\u003c/b>，K12 高中段顺风\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>采购程序\u003c/b>\u003c/td>\n\u003ctd>合同可约定\u003cb>\"不受招标法与政府采购法约束、无需招标\"\u003c/b>（海兴合同原文）\u003c/td>\n\u003ctd>走政府采购公开招标/单一来源，公告可查\u003c/td>\n\u003ctd>职教\u003cb>透明度低\u003c/b>：政采网查不到，尽调难度大得多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>合同期限\u003c/b>\u003c/td>\n\u003ctd>\u003cb>15–20 年\u003c/b>长约（皖北 20 年、古蔺 20 年、海兴 20 年、文山 15 年）\u003c/td>\n\u003ctd>3–5 年为主（奉贤 5 年、长沙 6 年一轮）\u003c/td>\n\u003ctd>职教长约 = 收益更稳，但\u003cb>与财政部 102 号令\"购买服务合同一般≤1 年、最长≤3 年\"存在张力\u003c/b>（见下）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cb>收入主体\u003c/b>\u003c/td>\n\u003ctd>\u003cb>学生\u003c/b>（后勤消费 + 专业共建费，约占 4/5）\u003c/td>\n\u003ctd>\u003cb>政府财政\u003c/b>（委托管理费为主）\u003c/td>\n\u003ctd>职教本质是\u003cb>面向学生的消费型生意\u003c/b>，不是 2G 生意\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"alert purple\">\n\u003cb>一个必须点出的术语问题：\u003c/b>天坤自称\"\u003cb>PPP 理论下的 TOT 合作办学模式\u003c/b>\"。但财政部《政府和社会资本合作模式操作指南》（财金〔2014〕113 号）对 TOT 的定义是\"政府将存量资产\u003cb>所有权有偿转让\u003c/b>给社会资本……期满后\u003cb>资产及其所有权\u003c/b>移交政府\"——\u003cb>核心是所有权转让\u003c/b>。而天坤始终坚持\"国有资产性质不变\"，\u003cb>所有权从未转让\u003c/b>。按官方分类，它的做法更接近\"\u003cb>管理合同（MC）\u003c/b>\"（政府保留所有权、只付管理费），而管理合同的官方建议期限是\u003cb>不超过 3 年\u003c/b>。\n    \u003cbr/>\u003cbr/>同时：\u003cb>未找到任何证据表明天坤/优蓝的项目进入财政部或发改委的 PPP 项目库\u003c/b>。学者研究也指出，官方 PPP 库里的教育类项目（职教近 10 个）\u003cb>都是基础设施建设融资\u003c/b>，没有\"委托管理\"类。\u003cb>所以\"PPP/TOT\"在这里更像是一套对外话术，而不是一个关于交易结构的准确描述。\u003c/b>\n\u003cbr/>\u003cbr/>\u003cb>为什么这对研究委托方重要：\u003c/b>如果将来有人拿\"我们是 PPP/TOT 模式、有政策背书\"来谈合作，这句话本身\u003cb>不构成任何合规保证\u003c/b>。要看的还是合同：\u003cb>谁是办学主体、谁收钱、期限多长、走不走招投标。\u003c/b>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 合规 ============ -->\n\u003csection id=\"s5\">\n\u003ch2 class=\"sec\">5 合规版图：一个真实开口，三道硬天花板\u003c/h2>\n\u003cp style=\"font-size:13.6px;color:var(--ink2)\">跟 K12 相比，职教的政策环境是\"\u003cb>开口更大，但天花板更硬\u003c/b>\"。这个组合很少见，值得单独说。\u003c/p>\n\u003cdiv class=\"box ok\" style=\"margin-bottom:14px\">\n\u003cdiv class=\"tagline\">开口 · 法律依据\u003c/div>\n\u003ch4>✅ 整校托管有国家级依据，且没有 K12 那两条红线\u003c/h4>\n\u003cul class=\"tight\">\n\u003cli>\u003cb>合法依据的源头\u003c/b>是 2014 年《国务院关于加快发展现代职业教育的决定》（国发〔2014〕19 号）：\"探索公办和社会力量举办的职业院校\u003cb>相互委托管理和购买服务\u003c/b>的机制。\"\u003cspan class=\"ev ev-a\">一手·法规\u003c/span>\u003cbr/>\u003cspan style=\"font-size:12.6px;color:#8494a8\">注意：依据在\"决定\"里，不在 2022 年新《职业教育法》里——新法\u003cb>没有\u003c/b>\"委托管理\"字样。\u003c/span>\u003c/li>\n\u003cli>\u003cb>《民促法实施条例》§13（协议控制）和 §45（关联交易）不适用于中职\u003c/b>。教育部 2021 年解读明确表示：高中阶段非营利民办校与职业教育、高等教育的非营利民办校，\"即便被社会组织通过协议控制，对整体发展影响不大\"。\u003cspan class=\"ev ev-a\">一手·法规+解读\u003c/span>\u003c/li>\n\u003cli>第八条还允许\"实施职业教育的公办学校可以吸引企业的资本、技术、管理等要素\"——这是公办职校与社会资本合作的上位法依据。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003ch3>三道天花板（都是硬的）\u003c/h3>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"box warn\">\n\u003cdiv class=\"tagline\">天花板一 · 治理\u003c/div>\n\u003ch4>党组织领导的校长负责制\u003c/h4>\n\u003cp>《职业教育法》第三十五条：\u003cb>\"公办职业学校实行中国共产党职业学校基层组织领导的校长负责制\"\u003c/b>。\u003c/p>\n\u003cp style=\"margin-top:8px\">意即：受托方派出的只能叫\"执行校长\"，\u003cb>重大事项必须经党委/党总支决策\u003c/b>。海兴合同也印证了——\u003cb>理事长由甲方任命，重大事项由党总支会议决定\u003c/b>。\u003c/p>\n\u003cp style=\"margin-top:8px\">\u003cb>结论：托管方的\"控制权\"远小于合同字面授权。\u003c/b>这一点跟 K12 司法上\"四权整体让渡即无效\"的判准方向一致，但职教是\u003cb>预防性地写进了法律\u003c/b>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"box warn\">\n\u003cdiv class=\"tagline\">天花板二 · 采购程序\u003c/div>\n\u003ch4>20 年长约 vs 购买服务 3 年上限\u003c/h4>\n\u003cp>《政府购买服务管理办法》（财政部令第 102 号）第 24 条：政府购买服务合同履行期限\u003cb>一般不超过 1 年\u003c/b>，可以签订不超过 \u003cb>3 年\u003c/b>的合同。\u003c/p>\n\u003cp style=\"margin-top:8px\">而天坤的合同是 \u003cb>15–20 年\u003c/b>，且海兴合同\u003cb>自述\"不受政府采购法约束、无需招标\"\u003c/b>。\u003c/p>\n\u003cp style=\"margin-top:8px\">\u003cb>这是整个模式里最脆的一环\u003c/b>——它靠\"协议合作\"这个定性绕开了采购程序，但\u003cb>这个定性能否长期站得住，未见判例支撑\u003c/b>（标\"未找到\"）。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"box no\">\n\u003cdiv class=\"tagline\">天花板三 · 实习（死穴）\u003c/div>\n\u003ch4>实习人头费已被条文封死\u003c/h4>\n\u003cp>教育部等八部门《职业学校学生实习管理规定》（教职成〔2021〕4 号）划了 \u003cb>1 个\"严禁\" + 27 个\"不得\"\u003c/b>，其中第十九条：\u003c/p>\n\u003cdiv class=\"quote\" style=\"margin:8px 0\">\"职业学校和实习单位\u003cb>不得向学生收取实习押金、培训费、实习报酬提成、管理费、实习材料费、就业服务费或者其他形式的实习费用\u003c/b>。\"\u003c/div>\n\u003cp>实习报酬还须\"不低于同岗位试用期工资的 \u003cb>80%\u003c/b>\"、\u003cb>按月足额货币发放\u003c/b>。\u003c/p>\n\u003cp style=\"margin-top:8px\">\u003cb>为什么这是死穴：\u003c/b>职教服务商传统上最诱人的利润来源就是\"组织学生实习→从企业或学生端抽成\"。这条被明文堵死后，\u003cb>任何以此为商业模式的方案都属于违规\u003c/b>。历史通报案例（盐城技师学院\"人头费\"、桂林舞蹈学校、南京交通科技学校等）全部踩在这一点上。\u003cspan class=\"ev ev-a\">一手·国务院督查/央媒\u003c/span>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"box no\">\n\u003cdiv class=\"tagline\">附加约束 · 收费与后勤\u003c/div>\n\u003ch4>向学生收费的合规边界在收紧\u003c/h4>\n\u003cul class=\"tight\" style=\"font-size:13.2px\">\n\u003cli>\u003cb>服务性收费须自愿、非营利\u003c/b>；\"学校不得在代收费中获取差价\"、\"代收费收入由学校全部转交提供服务的单位，不得计入学校收入\"\u003cspan class=\"ev ev-a\">五部门 2020\u003c/span>\u003c/li>\n\u003cli>\u003cb>食堂\u003c/b>：可委托承包，但须\u003cb>公开招投标\u003c/b> + 持食品经营许可 + 建考核退出机制；\u003cb>\"实施营养改善计划的农村义务教育学校食堂不得对外承包或委托经营\"\u003c/b>（对中职不适用，但风向明确）\u003cspan class=\"ev ev-a\">教育部办公厅 2024 / 市场监管总局等 2025\u003c/span>\u003c/li>\n\u003cli>\u003cb>\"中小学、幼儿园一般不得在校内设置小卖部、超市\"\u003c/b>——优蓝的\"校园超市\"业务因此处在灰色地带\u003c/li>\n\u003cli>\u003cb>免学费补助（中央 2,000 元/生·年）直接拨至学校，不进入企业账户\u003c/b> → 受托方无法从人头经费中分成，只能走合同明列的管理服务费\u003cspan class=\"ev ev-a\">一手·财政部办法\u003c/span>\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 公司本身 ============ -->\n\u003csection id=\"s6\">\n\u003ch2 class=\"sec\">6 优蓝这家公司本身：值不值得当样本？\u003c/h2>\n\u003cp style=\"font-size:13.6px;color:var(--ink2)\">作为\"职教托管唯一可研究的中概上市样本\"，它有两面：\u003cb>业务模式看得很清楚（因为要法定披露），但公司基本面问题不少。\u003c/b>\u003c/p>\n\u003cdiv class=\"card\">\n\u003ch3 style=\"margin-top:0\">全样本对比：优蓝 vs K12 教育集团\u003c/h3>\n\u003cdiv class=\"scroll\" style=\"margin-top:6px\">\n\u003ctable style=\"min-width:900px\">\n\u003cthead>\u003ctr>\u003cth>维度\u003c/th>\u003cth>优蓝国际 YOUL（FY2025）\u003c/th>\u003cth>天立国际控股 1773.HK（FY2025）\u003c/th>\u003cth>差异\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>营收\u003c/b>\u003c/td>\u003ctd>人民币 18.54 亿元（US$265.2M）\u003c/td>\u003ctd>人民币 35.89 亿元\u003c/td>\u003ctd>约为天立一半\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>收入结构\u003c/b>\u003c/td>\u003ctd>\u003cb>劳务外包 92.7%\u003c/b>；市场服务 3.9%；\u003cb>职教 2.4%\u003c/b>；招聘 1.0%\u003c/td>\u003ctd>综合教育服务 52.1%；产品销售 27.7%；综合后勤 17.1%；管理及特许经营费 3.2%\u003c/td>\u003ctd>\u003cb>优蓝本质是人力资源公司\u003c/b>，不是教育公司\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>综合毛利率\u003c/b>\u003c/td>\u003ctd>\u003cb>10.4%\u003c/b>（FY2024 14.5%、FY2023 14.7%，逐年下滑）\u003c/td>\u003ctd>\u003cb>≈33.8%\u003c/b>\u003c/td>\u003ctd>优蓝是\u003cb>低毛利走量\u003c/b>生意\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>归母净利\u003c/b>\u003c/td>\u003ctd>人民币 0.43 亿元（净利率 2.3%）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>薄利\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>职教战略定位\u003c/b>\u003c/td>\u003ctd colspan=\"2\">\u003cb>20-F 原文：\u003c/b>\u003cspan class=\"en\" style=\"display:inline;font-family:var(--mono);font-size:11.6px;color:#6b7787\">\"our vocational education business functions as \u003cb>the additional source of blue-collar talent\u003c/b> to address the labor demand of the corporate customers of our HR recruitment and employee management businesses, thereby \u003cb>enhancing their stickiness\u003c/b>.\"\u003c/span>\u003cbr/>中译：职教业务的作用是\u003cb>为招聘与雇员管理业务的客户提供额外蓝领人才供给，增强其粘性\u003c/b>。\u003cspan class=\"ev ev-a\">一手·20-F\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"alert blue\">\n\u003cb>所以回答\"是利润中心还是蓄水池\"：优蓝自己写的是蓄水池。\u003c/b>职教板块 2.4% 的收入 + 51% 的毛利额（约 2,300 万元）撑不起集团；公司董事长在采访里的原话也是——为搭建\"\u003cb>劳动力蓄水池\u003c/b>\"，优蓝瞄准了产业链上游。\u003cb>这意味着：职教托管在优蓝体系里被当作获客与供人入口，而不是要赚钱的业务。\u003c/b>如果它自己都不指望这块赚钱，那\"卖给托管方 SaaS\"的商业逻辑就更弱了。\n    \u003c/div>\n\u003c/div>\n\u003ch3>规模口径漂移：五个互相矛盾的版本\u003c/h3>\n\u003cdiv class=\"scroll\">\n\u003ctable style=\"min-width:920px\">\n\u003cthead>\u003ctr>\u003cth>时间\u003c/th>\u003cth>口径\u003c/th>\u003cth>出处\u003c/th>\u003cth>性质\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>2019-09\u003c/td>\u003ctd>携手近 30 余个地方政府，创建\u003cb>近 30 所\u003c/b> PPP 合作中职\u003c/td>\u003ctd>王云雷教师节致辞\u003c/td>\u003ctd>\u003cspan class=\"ev ev-c\">企业自述\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>截至 2021\u003c/td>\u003ctd>TOT 管理院校 \u003cb>24 所\u003c/b> + 专业共建 36 个 + 技能培训 12 个，在校生近 5 万\u003c/td>\u003ctd>天坤官网\u003c/td>\u003ctd>\u003cspan class=\"ev ev-c\">企业自述\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2022-12\u003c/td>\u003ctd>托管 \u003cb>23 所\u003c/b> + 自营 1 所 + 专业共建 37 个 + 技能培训 9 所\u003c/td>\u003ctd>港交所招股书\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"ev ev-a\">一手·法律文件\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2025-07（上市交割）\u003c/td>\u003ctd>职校 \u003cb>25 所\u003c/b> + 课程开发项目 \u003cb>25 个\u003c/b>\u003c/td>\u003ctd>上市交割稿 / 6-K\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"ev ev-a\">一手·法律文件\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2026-04-14\u003c/td>\u003ctd>仍是 \u003cb>25 所 + 25 个\u003c/b>\u003c/td>\u003ctd>业绩会预告\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"ev ev-a\">一手\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>2026-04-30\u003c/b>\u003c/td>\u003ctd>\u003cb>37 所 + 146 个项目\u003c/b>\u003c/td>\u003ctd>\u003cb>SEC 20-F\u003c/b>\u003c/td>\u003ctd>\u003cb>\u003cspan class=\"ev ev-a\">一手·年报\u003c/span>\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>当前\u003c/td>\u003ctd>管理运营 \u003cb>29 所\u003c/b> + 25 个专业建设项目 + 18 省 43 市县 + 注册学生 6.5 万\u003c/td>\u003ctd>优蓝中文官网\u003c/td>\u003ctd>\u003cspan class=\"ev ev-c\">企业自述\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>截至 2025\u003c/td>\u003ctd>中高职合作院校\u003cb>近 100 所\u003c/b>，在籍学生超 10 万\u003c/td>\u003ctd>天坤官网\u003c/td>\u003ctd>\u003cspan class=\"ev ev-c\">企业自述\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2025–2026\u003c/td>\u003ctd>直属中职 \u003cb>60 余所\u003c/b>，管理在籍学生超 \u003cb>20 万人\u003c/b>\u003c/td>\u003ctd>川商总会访谈\u003c/td>\u003ctd>\u003cspan class=\"ev ev-c\">企业自述\u003c/span>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv class=\"alert red\">\n\u003cb>三处硬矛盾：\u003c/b>\n\u003cbr/>① \u003cb>7 周内从 25 所变 37 所、25 个项目变 146 个项目\u003c/b>（2026-04-14 业绩会 → 2026-04-30 年报），这个增速不可能靠新签约实现——\u003cb>几乎肯定是口径变更（把专业共建项目也算进来了）\u003c/b>。\n    \u003cbr/>② \u003cb>中文官网说 29 所，英文年报说 37 所\u003c/b>，同一家公司同一时点两个数字。\n    \u003cbr/>③ \u003cb>在校生数：中文官网 6.5 万 vs 川商总会口径 20 万，差 3 倍。\u003c/b>\n\u003cbr/>\u003cbr/>\u003cb>跟海亮（54/84/177/178/201 所）是同一个套路——\"托管校数\"在职业教育领域同样不是一个可靠指标。\u003c/b>真正可靠的是营收和合同级证据。\n  \u003c/div>\n\u003ch3>治理与市场信号（红旗）\u003c/h3>\n\u003cdiv class=\"scroll\">\n\u003ctable style=\"min-width:880px\">\n\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>事实\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>\u003cb>上市方式\u003c/b>\u003c/td>\u003ctd>2025-07-10 与 SPAC（Distoken Acquisition Corp）合并上市，PIPE 发行价 \u003cb>$10.00/股\u003c/b>，募资约 2,700 万美元\u003c/td>\u003ctd>De-SPAC 路径，非传统 IPO 承销\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>股价\u003c/b>\u003c/td>\u003ctd>上市首日收盘 \u003cb>$5.00\u003c/b>（盘中最高 $5.50）→ 近期约 \u003cb>$0.31\u003c/b>，市值约 2,350–2,500 万美元，一年跌幅约 -83%\u003c/td>\u003ctd>较发行价跌约 \u003cb>97%\u003c/b>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>纳斯达克警示\u003c/b>\u003c/td>\u003ctd>\u003cb>2026-07-27 收到\"1 美元最低买入价\"不合规通知\u003c/b>，合规期至 2027-01-25（可申请再延 180 天）\u003c/td>\u003ctd>面临退市风险，\u003cspan class=\"ev ev-a\">一手·公司公告\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>审计与内控\u003c/b>\u003c/td>\u003ctd>审计机构 Onestop Assurance PAC（新加坡，PCAOB 6732）；因属\"新兴成长公司\"(EGC)\u003cb>豁免 SOX 404(b) 审计师内控鉴证\u003c/b>；\u003cb>自曝存在 1 项内控重大缺陷\u003c/b>——\"缺乏足够熟悉美国 GAAP 与 SEC 报告要求的财务人员\"，并称若做过正式评估\"可能发现更多缺陷\"\u003c/td>\u003ctd>\u003cb>外部独立方未对内控出具意见\u003c/b>；公司自评已不达标\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>治理变动\u003c/b>\u003c/td>\u003ctd>2025-11-21（上市后约 4 个月）\u003cb>CFO 兼董事与独立董事/审计委员会主席双双辞任\u003c/b>，公司称\"非因分歧\"\u003c/td>\u003ctd>上市初期核心财务与治理岗位同时更替\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>股权结构\u003c/b>\u003c/td>\u003ctd>\u003cb>王云雷持股 14.7%，但持有 77.5% 投票权\u003c/b>（双层股权）\u003c/td>\u003ctd>创始人绝对控制\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>历史合规\u003c/b>\u003c/td>\u003ctd>自曝\"过去\u003cb>未为少数员工缴纳社保、未开立公积金账户\u003c/b>\"，可能被要求补缴并加收滞纳金/罚款\u003c/td>\u003ctd>用工合规历史瑕疵\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>上市前资产剥离\u003c/b>\u003c/td>\u003ctd>2021-09-30 以换股方式剥离劳务派遣主体\"蓝德实体\"（14 家，占企业客户约 70%），回购 21,176,470 股 @ RMB6.5 ≈ \u003cb>1.377 亿元\u003c/b>。招股书存在\u003cb>两套说法\u003c/b>：一说蓝德股东对战略方向看法不同而退出，一说公司主动收缩\u003cbr/>\u003cspan style=\"font-size:12px;color:#8494a8\">注：剥离时蓝德业绩正上升（2021 前 9 月收入 3,740 万，毛利率约 25%）\u003c/span>\u003c/td>\u003ctd>剥离标的\u003cb>当时比母公司业务更赚\u003c/b>，且说法不一\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>关联办学信号\u003c/b>\u003c/td>\u003ctd>京山市：与公办校同址（轻机大道 26 号）的关联民办校\"荆门市京山天坤职业技术学校\"（举办者为上海书萱教育投资管理），\u003cb>2025 年度年检为全市唯一\"不合格单位\"\u003c/b>（京山市教育局 2026-06-22）\u003c/td>\u003ctd>公办托管校与关联民办校\u003cb>同址办学\u003c/b>，需关注利益安排，\u003cspan class=\"ev ev-a\">一手·教育局公示\u003c/span>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>未找到\u003c/b>\u003c/td>\u003ctd>做空报告、集体诉讼、财务重述、审计师变更、SEC 执法调查——\u003cb>均未找到\u003c/b>\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 判断 ============ -->\n\u003csection id=\"s7\">\n\u003ch2 class=\"sec\">7 判断：这门生意能不能做\u003c/h2>\n\u003cp style=\"font-size:13.6px;color:var(--ink2)\">分三层回答，因为\"职教托管\"其实是三件不同的事，被一个词捆在一起了。\u003c/p>\n\u003cdiv class=\"grid2\">\n\u003cdiv class=\"box no\">\n\u003cdiv class=\"tagline\">第一层 · 政府付费型整校托管\u003c/div>\n\u003ch4>❌ 不建议进入\u003c/h4>\n\u003cul class=\"tight\" style=\"font-size:13.2px\">\n\u003cli>单校年费只有 K12 的 \u003cb>1/10–1/20\u003c/b>，撑不起一个业务线\u003c/li>\n\u003cli>市场在收缩：中职招生 5 年 -30%，且\"少而精\"是政策方向\u003c/li>\n\u003cli>\"党组织领导校长负责制\"写进法律，\u003cb>决策权天花板无法通过谈判突破\u003c/b>\u003c/li>\n\u003cli>收入靠人头，模型要求扩招，与市场趋势正相反\u003c/li>\n\u003cli>已有官方认定失败的案例（文山市）\u003c/li>\n\u003c/ul>\n\u003cp style=\"margin-top:8px\">\u003cb>它甚至有明确的失败路径：\u003c/b>接手一所县域中职 → 靠扩招维持人头收入 → 生源下滑 → 效果不达标 → 政府不续约或收回 → 前期的改造投入沉没。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"box ok\">\n\u003cdiv class=\"tagline\">第二层 · 专业共建 / 教育服务\u003c/div>\n\u003ch4>✅ 这才是真生意（也是最接近我们的位置）\u003c/h4>\n\u003cul class=\"tight\" style=\"font-size:13.2px\">\n\u003cli>\u003cb>规模已经超过托管费\u003c/b>：2,650 万元/年 vs 管理费 940 万元，是 2.8 倍\u003c/li>\n\u003cli>计价方式健康：\u003cb>每生每学期 1,600–5,000 元\u003c/b>，按课程/专业定价，\u003cb>有定价权\u003c/b>（不像管理费被政府压到 500 元/生·学期）\u003c/li>\n\u003cli>\u003cb>带教学/课程属性\u003c/b> → 这是 AI 教育 SaaS 唯一能真正嵌入的接口\u003c/li>\n\u003cli>\u003cb>不受 K12 那两条红线约束\u003c/b>（协议控制 + 关联交易）\u003c/li>\n\u003cli>已经有真实需求方：校企共建、产业学院、二级学院\u003c/li>\n\u003c/ul>\n\u003cp style=\"margin-top:8px\">\u003cb>但必须避开一个东西：实习人头费。\u003c/b>见 §5 死穴。\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"alert purple\">\n\u003cb>第三层 · 作为\"劳动力蓄水池\"\u003c/b>\n\u003cp style=\"margin-top:6px\">这是优蓝模式的最深层逻辑，也是它自己写进年报的：职教托管的价值不在赚钱，而在\u003cb>源源不断地给下游劳务外包业务输送人力\u003c/b>。这一层的门槛是\"你有下游变现端\"——优蓝有 17.2 亿的劳务外包盘子来接这些人，所以它能忍受职教不赚钱。\u003c/p>\n\u003cp style=\"margin-top:8px\">\u003cb>对研究委托方/公司的含义：我们大概率没有这个下游。所以这一层不适用，也不该被它的存在说服——\u003c/b>\"人家 37 所学校\"不等于\"这门生意能赚钱\"，它可能是用主业现金流在养一个入口。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"card\" style=\"border-left:5px solid var(--red)\">\n\u003ch3 style=\"margin-top:0\">对我们（AI 教育 SaaS）的直接结论\u003c/h3>\n\u003col class=\"tight\">\n\u003cli>\u003cb>\"把 SaaS 卖给职教托管方\"这条路很窄。\u003c/b>托管方自己单校只收 25 万/年管理费，商业模式靠学生人头和后勤，\u003cb>没有为管理软件付费的预算和习惯\u003c/b>。这跟 K12 完全相反——K12 托管有 100–500 万/校的政府付费，才有能力采购系统。\u003c/li>\n\u003cli>\u003cb>要看就看专业共建。\u003c/b>它是纯\"课程与教学\"业务、按学生/课程收费、有定价权、不受 K12 红线约束。如果我们的产品能进\"专业共建\"的交付物（课程内容、教学平台、实训方案、质量评价），商业逻辑是通的。\u003c/li>\n\u003cli>\u003cb>一条必须提前划清的红线：绝不碰实习环节的收费（押金/培训费/报酬提成/管理费/实习材料费/就业服务费）。\u003c/b>这是 27 个\"不得\"覆盖的区域，也是这个行业过去暴雷的集中区。\u003cb>产品设计上就要做隔离\u003c/b>——可以服务\"实习管理的信息化\"，不能从实习里分成。\u003c/li>\n\u003cli>\u003cb>真正的机会可能在\"合规与质量可追溯\"上。\u003c/b>这个行业现在最缺的是可核验的办学质量数据（文山案例就是效果无法达标），而政采/公办体系正在要求 KPI 化、可考核。做\"结果可归因 + 合规留痕\"的工具，比做\"教学提分\"更贴近这个行业的真实痛点。\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003c/section>\n\u003c!-- ============ 缺口 ============ -->\n\u003csection id=\"s8\">\n\u003ch2 class=\"sec\">8 数据缺口与建议的下一步\u003c/h2>\n\u003cdiv class=\"card\">\n\u003ch3 style=\"margin-top:0\">本轮明确没找到的东西（不猜）\u003c/h3>\n\u003cul class=\"tight\">\n\u003cli>\u003cb>职教分部的经营利润。\u003c/b>20-F 只披露\"分部业绩＝毛利\"，\u003cb>不披露分部经营利润/净利\u003c/b>。所以\"托管业务到底赚不赚钱\"在法律披露层面无解。\u003c/li>\n\u003cli>\u003cb>学生餐饮/宿舍/用品的单独金额。\u003c/b>并入\"市场服务\"（与在线零售、员工福利混计），\u003cb>无法拆出教育后勤的真实规模\u003c/b>。这是本行业最大的黑箱。\u003c/li>\n\u003cli>\u003cb>政府委托协议是否\"另行授权\"向学生收费。\u003c/b>20-F 未披露，只提到\"另签采购/供货协议\"。\u003cb>这是最需要现场尽调撬开的一点。\u003c/b>\u003c/li>\n\u003cli>\u003cb>37 所托管校的完整名单与逐校实时状态。\u003c/b>天坤官网列了 21 所，抽样核验 12 所后判断这是\"历史合作 + 现在合作 + 仅签战略协议\"的混合名单；\u003cb>内蒙古经贸外语职业学院未找到任何独立合作证据\u003c/b>。\u003c/li>\n\u003cli>\u003cb>任何政府公告明确宣布托管终止/学校被收回。\u003c/b>未找到。最接近的是文山市（官方认定失败但未终止）和京山关联民办校年检不合格。\u003c/li>\n\u003cli>\u003cb>天坤/优蓝在财政部或发改委 PPP 项目库中的入库记录。\u003c/b>未找到（这本身就是结论）。\u003c/li>\n\u003cli>\u003cb>TOT 合同里的升学率/就业率硬 KPI 明文、以及期满交回条款。\u003c/b>公开合同文本中未披露。\u003c/li>\n\u003cli>\u003cb>接管后失败的托管项目是否真的会退出。\u003c/b>未见判例，制度上\"能退\"，实操上未见样本。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"card\" style=\"border-left:5px solid var(--accent)\">\n\u003ch3 style=\"margin-top:0\">建议下一步（按性价比排序）\u003c/h3>\n\u003col class=\"tight\">\n\u003cli>\u003cb>先验一个假设：专业共建的付费方到底是谁、决策链多长。\u003c/b>如果是学生付费，那它的可持续性受生源和家庭支付能力约束；如果是学校/财政付费，逻辑就更像 K12。这一条决定我们能不能进。\u003cb>优先度最高。\u003c/b>\u003c/li>\n\u003cli>\u003cb>挖厦门倍凡。\u003c/b>它是唯一有 A 股上市公司收购公告披露过财务/规模数据的整校托管玩家（2020 年披露\"管理 26 所中高职、18 万生源\"，后被科斯伍德拟收购未成）。\u003cb>它的数据比优蓝的软文可信得多\u003c/b>，而且是独立第三方（收购方尽调）口径。\u003c/li>\n\u003cli>\u003cb>横向比对\"公办高职托管县域中职\"这两个公办案例\u003c/b>（云南机电托管东川职中 12 年、新疆农职院托管洛浦县中职 4 轮 7 年）。它们不带商业动机，\u003cb>效果数据反而可能更干净\u003c/b>——可以用来判断\"托管到底有没有用\"。\u003c/li>\n\u003cli>\u003cb>如果要继续深入，我建议下一轮做\"专业共建\"专题\u003c/b>——把它从\"职教托管\"里单独拎出来研究：谁在做、怎么收费、合同长什么样、学生/学校的付费意愿和决策链、以及是否已有教育科技系统嵌入的先例。\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdiv class=\"alert amber\">\n\u003cb>关于本次信源的可靠性：\u003c/b>本简报最重要的两个数字（37 所、940 万管理费、2,650 万专业共建费、51% 毛利率、10–20 倍差距）都来自\u003cb>美国 SEC 法定披露文件\u003c/b>（20-F），可信度显著高于中国境内的企业软文和官网口径。\n    \u003cbr/>\u003cbr/>\u003cb>但要诚实说明一个问题：\u003c/b>SEC 披露的\"37 所\"本身也不能全信——因为同一家公司 7 周前才说 25 所。所以本简报\u003cb>不以\"37 所\"作为结论基础\u003c/b>，而以\"政府付费只有千万级\"这一量级判断作为结论基础——这个量级在多个独立信源上是一致的（管理费 940 万、专业共建 2,650 万、职教总收入 4,510 万）。\n  \u003c/div>\n\u003c/section>\n\u003c!-- ============ 信源清单 ============ -->\n\u003csection id=\"s9\">\n\u003ch2 class=\"sec\">9 信源清单（关键几条，可直接点开核）\u003c/h2>\n\u003cdiv class=\"alert green\">\n\u003cb>链接体检（2026-10-14 实测）：\u003c/b>下列链接均已逐条发起请求核对，\u003cb>全部可访问\u003c/b>。特别说明：SEC 的两个链接用普通工具直接抓会返回 403，那是 SEC 的\u003ca class=\"ext\" href=\"https://www.sec.gov/os/webmaster-faq#developers\" rel=\"noopener noreferrer\" target=\"_blank\">反爬策略\u003c/a>（要求声明 User-Agent），\u003cb>用浏览器正常打开没问题\u003c/b>——不要误判为失效。\n  \u003c/div>\n\u003cdiv class=\"grp\" style=\"background:#f0f4f9;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;color:#33475f;margin:22px 0 6px;display:inline-block\">A 优蓝国际法定披露（美国 SEC）— 本简报主证据\u003c/div>\n\u003cdiv class=\"card\" style=\"padding:16px 22px\">\n\u003cul class=\"tight\" style=\"font-size:12.8px;line-height:2.05\">\n\u003cli>\u003ca class=\"ext\" href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026050196/ea0285866-20f_youlife.htm\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝国际 20-F 年报（FY2025，2026-04-30 提交）\u003c/a> ← \u003cb>37 所托管校、940 万管理费、2,650 万专业共建费、51% 毛利率、10.4% 综合毛利率、内控重大缺陷、职教\"蓄水池\"定位，全部出自此文件\u003c/b>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.sec.gov/Archives/edgar/data/2046376/000149315225008121/ex10-12.htm\" rel=\"noopener noreferrer\" target=\"_blank\">SEC Exhibit 10.12 · 海兴县职业教育中心合作办学协议\u003c/a> ← \u003cb>20 年期、500 元/生·学期、理事长与党总支条款、\"不受招标法约束\"原文\u003c/b>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&amp;CIK=0002028177&amp;type=&amp;dateb=&amp;owner=include&amp;count=40\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝国际 EDGAR 全部申报文件索引（CIK 0002028177）\u003c/a> ← 想看别的合同附件/6-K 从这里进\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://ir.youlife.cn/2026-07-29-Youlife-Announces-Receipt-of-Notification-Letter-from-Nasdaq\" rel=\"noopener noreferrer\" target=\"_blank\">公司公告 · 收到纳斯达克 1 美元最低买入价不合规通知（2026-07-29）\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://ir.youlife.cn/2026-06-02-Youlife-Announces-Vocational-Education-Expansion-Strategy\" rel=\"noopener noreferrer\" target=\"_blank\">公司新闻稿 · 职教扩张战略（2026-06-02，37 所 + 146 项目口径）\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.prnewswire.com/news-releases/youlife-group-inc-announces-the-closing-of-the-business-combination-and-listing-on-nasdaq-302501493.html\" rel=\"noopener noreferrer\" target=\"_blank\">上市交割公告（2025-07-10 口径：25 所 + 25 项目）\u003c/a> ← 与年报 37 所对比用\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"grp\" style=\"background:#f0f4f9;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;color:#33475f;margin:22px 0 6px;display:inline-block\">B 政策法规原文（判断合规边界）\u003c/div>\n\u003cdiv class=\"card\" style=\"padding:16px 22px\">\n\u003cul class=\"tight\" style=\"font-size:12.8px;line-height:2.05\">\n\u003cli>\u003ca class=\"ext\" href=\"https://www.gov.cn/zhengce/content/2014-06/22/content_8901.htm\" rel=\"noopener noreferrer\" target=\"_blank\">国发〔2014〕19 号《国务院关于加快发展现代职业教育的决定》\u003c/a> ← \u003cb>整校托管合法依据的源头条款（\"探索公办和社会力量举办的职业院校相互委托管理和购买服务的机制\"）\u003c/b>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://tfs.mof.gov.cn/caizhengbuling/202001/t20200122_3463449.htm\" rel=\"noopener noreferrer\" target=\"_blank\">财政 l=\"noopener noreferrer\" target=\"_blank\">天坤教育官网（\"截至 2025\"口径：中高职合作院校近 100 所、在籍超 10 万）\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp class=\"footnote\">同一份清单里另有 2022 年港交所招股书口径（23 所 + 1 自营 + 37 专业共建 + 9 技能培训），可与上述数字并排对照——\u003cb>五个版本互相矛盾，见 §6。\u003c/b>\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003chr class=\"soft\"/>\n\u003cp class=\"footnote\" style=\"text-align:center\">快速情报简报（第一轮）· 2026-10-14 ｜ 样本：优蓝国际（NASDAQ: YOUL）/ 天坤国际教育集团 ｜ 配套底稿：职业教育托管_政策与行业底座尽调.md\u003cbr/>主证据：SEC 20-F (FY2025) / SEC Exhibit 10.12 海兴县合作办学协议 / 教育部·人社部统计公报 / 财政部令第102号 / 教职成〔2021〕4号\u003c/p>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","status":"历史原稿 · 含重要纠错","notice":"历史简报含重要纠错，请结合原文顶部的纠错说明与“核验校正版”阅读。"}]}</script></body></html>
