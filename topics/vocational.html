<noscript><p>Tab阅读需要JavaScript，请从“本主题全部材料”打开原稿。</p></noscript><footer class="topic-footer"><p>原始材料与校正版分别保留，请结合材料中的纠错及口径说明阅读。</p><a href="../index.html">返回资料库 ↑</a></footer></main><script type="application/json" id="topic-data">{"id":"vocational","title":"职教托管","tabs":[{"id":"C01","label":"核验校正版","title":"职教托管简报 · SEC核验校正版","href":"../materials/C01.html","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"robots\" content=\"noindex,nofollow\">\u003ctitle>职教托管简报 · SEC核验校正版 · 学校托管资料库\u003c/title>\u003clink rel=\"stylesheet\" href=\"../assets/reader.css\">\u003c/head>\u003cbody>\u003cheader class=\"reader-topbar\">\u003ca href=\"../index.html\">← 全部材料\u003c/a>\u003ca href=\"../sources.html\">来源明细\u003c/a>\u003c/header>\u003cdiv class=\"reader-layout\">\u003caside class=\"reader-toc\">\u003cstrong>本页目录\u003c/strong>\u003ca class=\"level-h1\" href=\"#ai\">职教托管：优蓝案例的收入结构与 AI 教育切入\u003c/a>\u003ca class=\"level-h2\" href=\"#_1\">一、谁付款，交付什么\u003c/a>\u003ca class=\"level-h2\" href=\"#_2\">二、钱从哪来：先看同年度收入，再问单校现金流\u003c/a>\u003ca class=\"level-h2\" href=\"#_3\">三、职教为什么会与人力资源业务放在一起\u003c/a>\u003ca class=\"level-h2\" href=\"#ai_1\">四、对 AI 教育：按可验证的交易推进\u003c/a>\u003ca class=\"level-h2\" href=\"#_4\">五、旧稿纠错与证据边界\u003c/a>\u003ca class=\"level-h2\" href=\"#_5\">六、来源与历史底稿\u003c/a>\u003c/aside>\u003cmain class=\"reader-body\">\u003cdiv class=\"reader-meta\">C01 / MD / 2026-10-19\u003c/div>\u003ch1>职教托管简报 · SEC核验校正版\u003c/h1>\u003cdiv class=\"correction-notice\">本页为2026年10月19日关键来源核验后的专题，具体核验范围及缺口见文末。\u003c/div>\u003ch1 id=\"ai\">职教托管：优蓝案例的收入结构与 AI 教育切入\u003c/h1>\n\u003cp>校正版｜核验日期：2026 年 10 月 19 日\u003c/p>\n\u003cp>优蓝的职教业务同时包含学校管理、专业课程共建及技术项目，不能把它压缩成一笔政府托管费。对 AI 教育公司，更有用的问题是：产品进入哪项交付、由谁采购、能改善哪项经营结果，以及服务收入能否按合同收回。\u003c/p>\n\u003ch2 id=\"_1\">一、谁付款，交付什么\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>业务\u003c/th>\n\u003cth>直接付款方及计价\u003c/th>\n\u003cth>托管或服务方交付\u003c/th>\n\u003cth>对 AI 教育的含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>学校管理\u003c/td>\n\u003ctd>被管理学校支付管理费；按学生等合同口径计价，结算衔接学期\u003c/td>\n\u003ctd>人才培养规划、课程、师资培训、学生管理与就业指导等\u003c/td>\n\u003ctd>产品应进入管理团队的工作流程，评估交付成本和办学质量能否改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业课程共建\u003c/td>\n\u003ctd>合作学校支付服务费；披露区间为每生每学期 1,600—5,000 元\u003c/td>\n\u003ctd>专业及课程建设、教学、师资与实训支持\u003c/td>\n\u003ctd>可讨论课程、教案、实训和评价的具体交付；这个区间是综合服务费，不能直接当作软件预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>智慧校园\u003c/td>\n\u003ctd>合作科技公司向优蓝支付项目服务费\u003c/td>\n\u003ctd>定制系统或实训设备；优蓝可作为项目分包方\u003c/td>\n\u003ctd>存在技术合作链条，可核查总包、分包、验收和回款安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>市场服务\u003c/td>\n\u003ctd>面向学生、蓝领人才、企业及其他终端客户，具体收款按业务合同\u003c/td>\n\u003ctd>购物、餐饮、住宿、福利等增值服务\u003c/td>\n\u003ctd>校园后勤只是其中部分，不能用整个分部测算校园市场\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>上述模式来自公司业务披露。学校管理和专业共建模式下，公司明确不直接向学生收学费，由学校收费；因此“最终资金来源”和“对服务商付款的合同主体”应分开追问。\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026070881/ea0295403-424b3_youlife.htm\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝 2026 年 6 月招股书：业务与收费章节\u003c/a>\u003c/p>\n\u003ch2 id=\"_2\">二、钱从哪来：先看同年度收入，再问单校现金流\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>FY2025 披露项目\u003c/th>\n\u003cth style=\"text-align: right;\">金额\u003c/th>\n\u003cth>可以支持的判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>职业教育服务总收入\u003c/td>\n\u003ctd style=\"text-align: right;\">4,510.8 万元\u003c/td>\n\u003ctd>包含多项职教服务，不能全算整校管理费\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其中：学校管理收入\u003c/td>\n\u003ctd style=\"text-align: right;\">约 940 万元\u003c/td>\n\u003ctd>是管理服务收入，不能等同全部政府投入或管理业务利润\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其中：专业课程共建收入\u003c/td>\n\u003ctd style=\"text-align: right;\">约 2,650 万元\u003c/td>\n\u003ctd>在已单列的两项业务中高于学校管理收入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>职教分部毛利 / 毛利率\u003c/td>\n\u003ctd style=\"text-align: right;\">2,298.7 万元 / 51.0%\u003c/td>\n\u003ctd>已有毛利，但不是分部净利润，更不是单校现金收益\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>市场服务收入\u003c/td>\n\u003ctd style=\"text-align: right;\">7,188 万元\u003c/td>\n\u003ctd>混有校园和校外业务，校园后勤金额不能单独拆出\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>金额与毛利取自招股书业务章节及财务报表分部附注。4,510.8 万元总收入与两项单列收入之间仍有差额，不把它自行归入校园后勤。\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026070881/ea0295403-424b3_youlife.htm\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝招股书：学校管理、课程共建及分部附注\u003c/a>\u003c/p>\n\u003cp>2025 年职教收入较 2024 年下降 9.8%；公司将其主要归因于终止部分回收周期较长的教育服务。这是公司对自身变化的解释，不能外推为整个托管行业的需求变化。\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026048281/ea028680001ex99-1.htm\" rel=\"noopener noreferrer\" target=\"_blank\">FY2025 业绩公告，2026 年 4 月 28 日\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>经营判断：\u003c/strong>收入规模能帮助识别业务权重，采购能力还要看项目成本、学校付款、应收期限和可动用预算。公开汇总数据不足以回答“单校赚多少钱”“单校每年能买多少软件”。应当取得一所学校连续两学期的合同、结算和实际到账，再建立单校模型。\u003c/p>\n\u003ch2 id=\"_3\">三、职教为什么会与人力资源业务放在一起\u003c/h2>\n\u003cp>公司明确披露：职教为招聘与员工管理业务的企业客户提供额外人才供给，并增强客户黏性；企业用工需求和合作关系也反过来帮助调整课程及就业服务。\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026070881/ea0295403-424b3_youlife.htm\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝招股书：业务协同章节\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>由此形成的判断：\u003c/strong>职教的价值可同时来自教育服务本身，以及对下游招聘、用工交付的支持。研究其回报时，应分别核算学校或专业项目的直接收益与下游协同收益，避免相互补贴掩盖项目亏损，也避免把协同作用误写成“职教不需要赚钱”。没有下游用工业务的 AI 教育公司，更需要验证自己能独立交付的价值及付款理由。\u003c/p>\n\u003cp>2026 年 6 月 2 日公司公告披露网络包含 37 所学校、146 项课程开发项目，并提出扩大职教培训、技术院校合作及具身智能产业学院等方向。前者是公司披露的网络规模，后者是战略计划，不能据此认定新增合同、交付或收入已经完成。\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026063811/ea029318701ex99-1.htm\" rel=\"noopener noreferrer\" target=\"_blank\">职教扩张战略公告\u003c/a>\u003c/p>\n\u003ch2 id=\"ai_1\">四、对 AI 教育：按可验证的交易推进\u003c/h2>\n\u003cp>以下是基于业务交付形成的切入假设，不代表已确认需求。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>切入假设\u003c/th>\n\u003cth>先验证什么\u003c/th>\n\u003cth>首个试点如何验收\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>专业共建中的教学与评价工具\u003c/td>\n\u003ctd>专业负责人是否需要；产品能否进入已有交付；预算由学校还是服务商承担\u003c/td>\n\u003ctd>选一个专业、一个年级，比较备课和评价工时、教师采用情况与学生技能评价结果；同时核对付款和续约条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>托管团队的教学管理工具\u003c/td>\n\u003ctd>管理费对应哪些人员和工作；重复工作是否足够多；谁能批准采购\u003c/td>\n\u003ctd>对一个反复发生的流程做前后对照，记录实际节约工时、差错和使用持续性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>智慧校园合作或分包\u003c/td>\n\u003ctd>谁掌握项目预算和总包；软件与设备如何拆价；验收及款项是否传导到分包方\u003c/td>\n\u003ctd>用小范围交付验证部署、教师使用、验收文件和到账，避免只以设备到校判断成功\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>优先接触专业共建负责人，是因为其交付与课程、教学、实训较接近；这不等于专业共建必然有 AI 预算。进入谈判前至少回答四个问题：合同谁签、预算谁批、价值谁验收、款项谁支付。若只能获得集团合作意向，还不能据此测算可复制收入。\u003c/p>\n\u003ch2 id=\"_4\">五、旧稿纠错与证据边界\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>旧稿表述\u003c/th>\n\u003cth>校正后的使用方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>940 万元除以 37 所，得到精确单校价格，再与 K12 比较得出 10—20 倍差距\u003c/td>\n\u003ctd>删除。年度收入与网络学校数缺少逐校对应；同一份 6 月招股书概述还出现 25 所、业务详章出现 37 所。不能以自行摊算代替合同单价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>政府付费只有约五分之一，专业共建向学生收费\u003c/td>\n\u003ctd>删除。约五分之一至多是管理收入占职教收入的算术比例，不是政府资金占比；直接付款主体为学校，学校收学生学费\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后勤是隐形大头或主要利润来源\u003c/td>\n\u003ctd>删除。市场服务含校外业务，缺少校园后勤独立收入及利润\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>托管方没赚到钱，所以不会买 SaaS\u003c/td>\n\u003ctd>删除。收入、毛利、净利润和现金流不同；当前材料不足以判断软件预算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>职教只是人才蓄水池，不是利润中心\u003c/td>\n\u003ctd>改为兼有教育服务收入和人才协同价值，不能据协同定位排除盈利目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合同写免招标，说明无需采购程序\u003c/td>\n\u003ctd>只可记录为合同当事方的约定或主张，不能作为法律结论；本专题不扩张法律研究\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>本轮核验对象是三份 SEC 托管的公司披露，不等于逐校独立核验。原《政策与行业底座尽调》仅作为历史线索保留，其全国学校数、收费政策及法律适用结论没有在本轮重新验证，不沿用为本专题当前事实。需要补齐的核心证据集中为：逐校合同及在管状态、学校预算与付款路径、分业务成本和应收、后勤独立账，以及一个可验证的 AI 采购案例。\u003c/p>\n\u003ch2 id=\"_5\">六、来源与历史底稿\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026070881/ea0295403-424b3_youlife.htm\" rel=\"noopener noreferrer\" target=\"_blank\">优蓝招股书，2026 年 6 月 22 日\u003c/a>：业务模式、收费主体、FY2025 分项数据及分部毛利。\u003c/li>\n\u003cli>\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026048281/ea028680001ex99-1.htm\" rel=\"noopener noreferrer\" target=\"_blank\">FY2025 业绩公告，2026 年 4 月 28 日\u003c/a>：年度收入变化及公司解释。\u003c/li>\n\u003cli>\u003ca href=\"https://www.sec.gov/Archives/edgar/data/2028177/000121390026063811/ea029318701ex99-1.htm\" rel=\"noopener noreferrer\" target=\"_blank\">职教扩张战略公告，2026 年 6 月 2 日\u003c/a>：37 所学校、146 项课程项目的公告口径，以及战略计划。\u003c/li>\n\u003c/ol>\n\u003cp>历史底稿：《职教托管-快速情报简报.html》《职业教育托管_政策与行业底座尽调.md》，原始调研日期为 2026 年 10 月 14 日。本校正版保留其中可核对的问题线索，以上述实时核验结果替换过强结论。\u003c/p>\u003csection class=\"material-sources\">\u003ch2>本材料来源入口\u003c/h2>\u003cul>\u003cli>来源见正文及全库来源明细。\u003c/li>\u003c/ul>\u003c/section>\u003c/main>\u003c/div>\u003c/body>\u003c/html>","status":"关键来源已核"},{"id":"L51","label":"政策与行业底稿","title":"职业教育托管·政策与行业底座尽调报告","href":"../materials/L51.html","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"robots\" content=\"noindex,nofollow\">\u003ctitle>职业教育托管·政策与行业底座尽调报告 · 学校托管资料库\u003c/title>\u003clink rel=\"stylesheet\" href=\"../assets/reader.css\">\u003c/head>\u003cbody>\u003cheader class=\"reader-topbar\">\u003ca href=\"../index.html\">← 全部材料\u003c/a>\u003ca href=\"../sources.html\">来源明细\u003c/a>\u003c/header>\u003cdiv class=\"reader-layout\">\u003caside class=\"reader-toc\">\u003cstrong>本页目录\u003c/strong>\u003ca class=\"level-h1\" href=\"#_1\">职业教育托管·政策与行业底座尽调报告\u003c/a>\u003ca class=\"level-h2\" href=\"#1996-vs-2022\">任务一 · 《职业教育法》1996 vs 2022 新旧对比\u003c/a>\u003ca class=\"level-h3\" href=\"#_2\">要点结论\u003c/a>\u003ca class=\"level-h3\" href=\"#_3\">关键条号对比与原文摘录\u003c/a>\u003ca class=\"level-h3\" href=\"#_4\">信源\u003c/a>\u003ca class=\"level-h2\" href=\"#_5\">任务二 · 中职学校&quot;委托管理/整校托管&quot;的现行政策依据\u003c/a>\u003ca class=\"level-h3\" href=\"#_6\">要点结论\u003c/a>\u003ca class=\"level-h3\" href=\"#_7\">关键政策文件与原文摘录\u003c/a>\u003ca class=\"level-h2\" href=\"#_8\">任务三 · 行业规模数据(教育部 + 人社部分口径)\u003c/a>\u003ca class=\"level-h3\" href=\"#_9\">要点结论\u003c/a>\u003ca class=\"level-h3\" href=\"#_10\">关键数据表(均标注口径与年份)\u003c/a>\u003ca class=\"level-h3\" href=\"#_11\">职普比政策演变\u003c/a>\u003ca class=\"level-h3\" href=\"#_12\">财政/生均经费(免学费政策口径)\u003c/a>\u003ca class=\"level-h2\" href=\"#vs\">任务四 · 职教托管玩家清单(整校托管 vs 专业共建/校企合作)\u003c/a>\u003ca class=\"level-h3\" href=\"#_13\">要点结论\u003c/a>\u003ca class=\"level-h3\" href=\"#_14\">主要玩家清单\u003c/a>\u003ca class=\"level-h3\" href=\"#_15\">信源分类小结\u003c/a>\u003ca class=\"level-h2\" href=\"#_16\">任务五 · 政策风险扫描\u003c/a>\u003ca class=\"level-h3\" href=\"#_17\">要点结论\u003c/a>\u003ca class=\"level-h3\" href=\"#_18\">关键法规摘录\u003c/a>\u003ca class=\"level-h2\" href=\"#_19\">我没找到的东西(显式列出,避免误读)\u003c/a>\u003ca class=\"level-h2\" href=\"#_20\">关键结论(对&quot;职教托管这门生意&quot;的判断)\u003c/a>\u003c/aside>\u003cmain class=\"reader-body\">\u003cdiv class=\"reader-meta\">L51 / MD / 2026-10（原稿）\u003c/div>\u003ch1>职业教育托管·政策与行业底座尽调报告\u003c/h1>\u003cdiv class=\"correction-notice\">历史研究资料按原调研时点保留。本文为研究加工材料；完整来源见资料明细。关键纠错另行标示，其他外链未在本轮逐条重验。\u003c/div>\u003ch1 id=\"_1\">职业教育托管·政策与行业底座尽调报告\u003c/h1>\n\u003cblockquote>\n\u003cp>调研时间:2026-10-14。用途:作为 AI 教育 SaaS 公司\"职业教育托管\"业务的政策与行业底座对照(参照对象为已完成尽调的 K12 民办学校委托管理)。\u003c/p>\n\u003cp>信源分级:①一手·法规(中央/地方法规原文) ②一手·统计(教育部、人社部统计公报) ③二手/机构(媒体、研究机构) ④企业自述(单独标注)。口径不清时在脚注/括号注明。\u003c/p>\n\u003c/blockquote>\n\u003chr/>\n\u003ch2 id=\"1996-vs-2022\">任务一 · 《职业教育法》1996 vs 2022 新旧对比\u003c/h2>\n\u003ch3 id=\"_2\">要点结论\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>法律地位拔高\u003c/strong>:2022 新法第三条将职业教育从\"国家教育事业的重要组成部分\"提升为\"与普通教育具有同等重要地位的教育类型\"——这是 26 年来最大定性变化。\u003c/li>\n\u003cli>\u003cstrong>办学主体打开\u003c/strong>:\u003cstrong>第九条\u003c/strong>第一次把\"企业\"写进法律作为\"重要办学主体\",支持\"资本、技术、知识、设施、管理\"等要素参与办学;同时\u003cstrong>第二十五条\u003c/strong>明确企业可\"利用资本、技术、知识、设施、设备、场地和管理等要素举办或联办\"职业学校。\u003c/li>\n\u003cli>\u003cstrong>多元办学、产教融合是新法主旋律\u003c/strong>,但\u003cstrong>没有出现\"委托管理\"\"政府购买服务\"\"整校托管\"字样\u003c/strong>——这是判断职教托管合法性的关键空白(详见任务二)。\u003c/li>\n\u003cli>\u003cstrong>管理层次提到国务院\u003c/strong>:新法第六条\"政府统筹、分级管理、地方为主、行业指导、校企合作、社会参与\";第八条\"国务院建立职业教育工作协调机制\"——把技工教育(人社部)和职业学校教育(教育部)在国务院层面拉通。\u003c/li>\n\u003cli>\u003cstrong>法律结构从 8 章 40 条变成 8 章 69 条\u003c/strong>,新增\"产教融合\"\"中国特色学徒制\"\"职业培训\"等独立条款,但\u003cstrong>办学体制的核心框架(政府主导、行业指导、校企合作)未发生颠覆性变化\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"_3\">关键条号对比与原文摘录\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>议题\u003c/th>\n\u003cth>1996 旧法\u003c/th>\n\u003cth>2022 新法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>职业教育定位\u003c/td>\n\u003ctd>\"国家教育事业的重要组成部分\"(第三条)\u003c/td>\n\u003ctd>\"与普通教育具有同等重要地位的教育类型\"(第三条)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>办学方针\u003c/td>\n\u003ctd>未单列企业主体地位\u003c/td>\n\u003ctd>\u003cstrong>第九条\u003c/strong>:\"国家鼓励发展多种层次和形式的职业教育,\u003cstrong>推进多元办学\u003c/strong>,支持社会力量广泛、平等参与职业教育。国家发挥企业的\u003cstrong>重要办学主体作用\u003c/strong>,推动企业深度参与职业教育,鼓励企业举办高质量职业教育。\"\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>企业可否办学\u003c/td>\n\u003ctd>第二十条:企业可单独/联合举办/委托学校对职工培训\u003c/td>\n\u003ctd>\u003cstrong>第二十五条\u003c/strong>:\"企业可以利用资本、技术、知识、设施、设备、场地和管理等要素,举办或者联合举办职业学校、职业培训机构。\"\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>委托关系\u003c/td>\n\u003ctd>第二十二条:\"政府主管部门、行业组织、企业事业组织\u003cstrong>委托学校\u003c/strong>、职业培训机构实施职业教育的,应当签订委托合同。\"(委托对象是\"学校\",企业是委托方)\u003c/td>\n\u003ctd>\u003cstrong>第二十八条\u003c/strong>:\"行业主管部门、工会等群团组织、行业组织、企业、事业单位等\u003cstrong>委托学校\u003c/strong>、职业培训机构实施职业教育的,应当签订委托合同。\"(语序与覆盖范围调整,但仍是\"企业→学校\",不是\"政府→企业整校托管\")\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>政府扶持方式\u003c/td>\n\u003ctd>第二十七条:地方政府可\"采取政府补贴、购买服务、提供助学贷款、建立奖励基金以及捐资激励等措施\"\u003c/td>\n\u003ctd>\u003cstrong>第二十六条\u003c/strong>:\"地方各级人民政府采取\u003cstrong>购买服务\u003c/strong>,向学生提供助学贷款、奖助学金等措施,对企业和其他社会力量依法举办的职业学校和职业培训机构予以扶持;对其中的非营利性职业学校和职业培训机构还可以采取政府补贴、基金奖励、捐资激励等扶持措施,\u003cstrong>参照同级同类公办学校生均经费等相关经费标准和支持政策给予适当补助\u003c/strong>。\"\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实习实训\u003c/td>\n\u003ctd>未单列\u003c/td>\n\u003ctd>第二十九、三十条:政府主导建设产教融合实习实训基地;\u003cstrong>推行中国特色学徒制\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产教融合激励\u003c/td>\n\u003ctd>未单列\u003c/td>\n\u003ctd>\u003cstrong>第二十七条\u003c/strong>:\"对深度参与产教融合、校企合作……的企业,按照规定给予奖励;对符合条件认定为\u003cstrong>产教融合型企业\u003c/strong>的,按照规定给予\u003cstrong>金融、财政、土地等支持\u003c/strong>,落实教育费附加、地方教育附加减免及其他\u003cstrong>税费优惠\u003c/strong>。\"\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>法律责任\u003c/td>\n\u003ctd>较粗\u003c/td>\n\u003ctd>第七章 8 条细则,新增举办者/校长/教师/学生权益条款\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>结论\u003c/strong>:新法\u003cstrong>没有出现\"委托管理\"\"政府购买服务整校运营\"\"公办学校能否整体交由企业运营\"等字样\u003c/strong>。法律委托合同(第二十八条)描述的是\"企业委托学校对职工培训\",而非\"政府委托企业运营公办学校\"——这意味着\u003cstrong>整校托管在《职业教育法》层面没有正面对应条款\u003c/strong>,其合法性必须从其他政策文件与地方实践中找依据(任务二)。\u003c/p>\n\u003ch3 id=\"_4\">信源\u003c/h3>\n\u003cul>\n\u003cli>《中华人民共和国职业教育法(2022 修订)》原文,教育部官网:\u003ca href=\"https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202204/t20220421_620064.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_sjzl/sjzl_zcfg/zcfg_jyfl/202204/t20220421_620064.html\u003c/a> (一手·法规)\u003c/li>\n\u003cli>新旧对照表:\u003ca href=\"https://www.eol.cn:10443/zhengce/law/202204/t20220421_2221495.shtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.eol.cn:10443/zhengce/law/202204/t20220421_2221495.shtml\u003c/a> (一手·法规转载)\u003c/li>\n\u003cli>解读:教育部\"以务实与改革精神落实《民办教育促进法实施条例》\":\u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/moe_2082/2021/2021_zl38/202105/t20210517_531836.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_xwfb/moe_2082/2021/2021_zl38/202105/t20210517_531836.html\u003c/a> (一手·解读)\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2 id=\"_5\">任务二 · 中职学校\"委托管理/整校托管\"的现行政策依据\u003c/h2>\n\u003ch3 id=\"_6\">要点结论\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>国家级文件支持\"公办学校委托管理\"\u003c/strong>,最早的明确条款出现在 \u003cstrong>2014 年国发〔2014〕19 号《国务院关于加快发展现代职业教育的决定》\u003c/strong>:\"探索公办和社会力量举办的职业院校\u003cstrong>相互委托管理和购买服务\u003c/strong>的机制\"——这是公职院校整校托管的\u003cstrong>第一份国家级合法依据\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>2022 年中办国办《关于深化现代职业教育体系建设改革的意见》\u003c/strong>进一步要求\"打造市域产教联合体\"\"行业产教融合共同体\"——主流形式是\"理事会实体化运作\"\"政府+企业+学校+科研机构\"混合体,\u003cstrong>整校托管只是其中一种形态,不是政策唯一推举的模式\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>2021《民促法实施条例》第 13 条\"协议控制\"红线仅约束\"实施义务教育的民办学校、实施学前教育的非营利性民办学校\"——明确不适用于中职、高中、高等教育\u003c/strong>。这是职教托管相对于 K12 托管的\u003cstrong>最大差异\u003c/strong>:K12 阶段不允许通过协议控制营利化,而职教没有同类红线。\u003c/li>\n\u003cli>\u003cstrong>第 45 条关联交易禁止也只针对义务教育阶段\u003c/strong>:新《实施条例》第四十五条明确\"实施义务教育的民办学校不得与利益关联方进行交易\"——该红线\u003cstrong>不延伸至中职、高中、高教\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>学校食堂、后勤委托管理是允许的,但有严格前置要求\u003c/strong>——不具备条件的中小学\"原则上自营\",公办食堂对外承包需招投标,且\u003cstrong>实施营养改善计划的农村义务教育学校食堂不得对外承包或委托经营\u003c/strong>(2024 年市场监管总局等五部门 + 教育部办公厅两份文件确认)。\u003c/li>\n\u003cli>\u003cstrong>地方实践已成熟\u003c/strong>:江西上栗、湖南鹤壁、河南信阳、安徽、四川、广西等地均有\"国有公办民营\"中职托管公开案例,但\u003cstrong>全国统一的程序文件仍缺失\u003c/strong>——属于\"地方试点 + 国家级原则支持\"的格局。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"_7\">关键政策文件与原文摘录\u003c/h3>\n\u003ch4 id=\"21-201419\">2.1 国发〔2014〕19 号(国务院·决定级文件,一手·法规)\u003c/h4>\n\u003cp>原文摘录(第七节三段):\u003c/p>\n\u003cblockquote>\n\u003cp>\"创新民办职业教育办学模式……探索发展股份制、混合所有制职业院校,允许以资本、知识、技术、管理等要素参与办学并享有相应权利。\u003cstrong>探索公办和社会力量举办的职业院校相互委托管理和购买服务的机制\u003c/strong>。引导社会力量参与教学过程,共同开发课程和教材等教育资源。社会力量举办的职业院校与公办职业院校具有同等法律地位,依法享受相关教育、财税、土地、金融等政策。健全政府补贴、购买服务、助学贷款、基金奖励、捐资激励等制度,鼓励社会力量参与职业教育办学、管理和评价。\"\u003c/p>\n\u003c/blockquote>\n\u003cp>→ 这是\u003cstrong>公办中职整校委托管理\u003c/strong>国家级法律依据的源头条款。\u003c/p>\n\u003ch4 id=\"22-202212\">2.2 中办国办《关于深化现代职业教育体系建设改革的意见》(2022.12,一手·法规)\u003c/h4>\n\u003cp>原文(战略任务 4、5):\u003c/p>\n\u003cblockquote>\n\u003cp>\"省级政府以产业园区为基础,打造兼具人才培养、创新创业、促进产业经济高质量发展功能的市域产教联合体。成立政府、企业、学校、科研机构等多方参与的理事会,实行实体化运作……\"\n\"支持龙头企业和高水平高等学校、职业学校牵头,组建学校、科研机构、上下游企业等共同参与的跨区域产教融合共同体……开展委托培养、订单培养和学徒制培养……\"\u003c/p>\n\u003c/blockquote>\n\u003cp>→ 注意:这里出现的是\u003cstrong>\"委托培养\"\u003c/strong>(订单式),不是整校托管。整校托管主要靠地方实践,没有国家级专门规范。\u003c/p>\n\u003ch4 id=\"23-2021\">2.3 民促法实施条例红线条款(2021 修订,一手·法规)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>第十三条\u003c/strong>(协议控制红线):\"任何社会组织和个人不得通过兼并收购、协议控制等方式控制\u003cstrong>实施义务教育的民办学校、实施学前教育的非营利性民办学校\u003c/strong>。\"\u003c/li>\n\u003cli>教育部解读(2021-05-17):\"对于目前的义务教育民办学校来说,坚持非营利性就没有影响……但对于高中阶段的非营利民办学校与职业教育、高等教育的非营利民办学校,即便被社会组织通过协议控制,对高中教育和职业教育、高等教育的整体发展影响不大。\" (一手·解读,来源同上)\u003c/li>\n\u003cli>\u003cstrong>第四十五条\u003c/strong>(关联交易红线):\"实施义务教育的民办学校不得与利益关联方进行交易。\"(只针对义务教育)\u003c/li>\n\u003cli>第七条关于公办举办权:\u003cstrong>实施职业教育的公办学校可以吸引企业的资本、技术、管理等要素,举办或者参与举办实施职业教育的营利性民办学校\u003c/strong>——公办职业院校与社会资本合作的\"上位法依据\"。\u003c/li>\n\u003c/ul>\n\u003cp>→ \u003cstrong>结论:K12 那两条红线(协议控制 + 关联交易)在职业教育领域不适用\u003c/strong>。\"未找到对应红线\"是更准确的表述:中职托管的合规风险\u003cstrong>不在\"能不能签协议控制\"上\u003c/strong>,而在①地方政府是否愿意、②公职教职工编制、③财政资金拨付路径、④学校党建管理(党组织领导的校长负责制)上。\u003c/p>\n\u003ch4 id=\"24\">2.4 学校食堂、后勤委托管理的现行规则\u003c/h4>\n\u003cul>\n\u003cli>教育部办公厅 2024 年 11 月《中小学校园食品安全和膳食经费管理工作指引》(一手·法规):\"具备条件的中小学食堂\u003cstrong>原则上采用自营方式供餐\u003c/strong>。食堂对外承包或委托经营的,应以招投标等方式公开选择……\"\"\u003cstrong>实施营养改善计划的农村义务教育学校食堂不得对外承包或者委托经营\u003c/strong>,确保食品安全和营养标准的有效实施。\"\u003c/li>\n\u003cli>市场监管总局等五部门 2024 年 7 月《关于强化集中用餐单位食堂承包经营食品安全管理工作的通知》(一手·法规):同样适用于\"中等职业学校\",建立准入、考核评价和退出机制。\u003c/li>\n\u003c/ul>\n\u003cp>→ 中职食堂委托经营\u003cstrong>允许\u003c/strong>,但要走招投标 + 食品安全总监/员配置 + 合同约束条款。\u003cstrong>不存在\"禁止对外承包\"的全国性红线\u003c/strong>。\u003c/p>\n\u003ch4 id=\"25\">2.5 地方实践(一手·统计/政府报道)\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>江西上栗县职业中等专业学校 + 厦门倍凡教育\u003c/strong>(一手·政府):2019 年 4 月签订托管协议,\"三不变\"(国有公办性质不变、公办教职工身份不变、政府按公办职业学校财政投入不变)、\"三分开\"(资产权与办学权分开、所有权与经营权分开、举办者与管理者分开)。在校生从不足 800 人增至 2000 余人。来源:江西省教育厅:\u003ca href=\"https://jyt.jiangxi.gov.cn/jxjyw/sqs455/content/content_1868948503446872064.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://jyt.jiangxi.gov.cn/jxjyw/sqs455/content/content_1868948503446872064.html\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>鹤壁工业中专 + 厦门倍凡\u003c/strong>(一手·政府):2019 年 2 月签约,5 年投资 5 个亿,目标在校生 5000 人以上,启动申办高职。来源:鹤壁市教育体育局官方微博 \u003ca href=\"https://weibo.com/5041074142/Hhv1pvrtZ\" rel=\"noopener noreferrer\" target=\"_blank\">https://weibo.com/5041074142/Hhv1pvrtZ\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>云南东川区 + 云南机电职业技术学院\u003c/strong>(一手·政府):2012 年起首份\"县域职教整建制托管\"协议,东川职中在校生扩大 3 倍。来源:《中国教育报》:\u003ca href=\"https://paper.jyb.cn/zgjyb/html/2026-01/08/content_144747_19199816.htm\" rel=\"noopener noreferrer\" target=\"_blank\">https://paper.jyb.cn/zgjyb/html/2026-01/08/content_144747_19199816.htm\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>新疆洛浦县中职 + 新疆农职院\u003c/strong>(一手·政府):2014 年起 4 轮整体托管,7 年在校生从 1000 到 4000。来源:人民日报:\u003ca href=\"https://www.peopleapp.com/rmharticle/30025600627\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.peopleapp.com/rmharticle/30025600627\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>安徽古蔺职高 + 天坤\u003c/strong>(企业自述):2009 年 8 月签约,集团-自主托管,在校生 5213 人。来源:天坤教育官网:\u003ca href=\"http://www.tkzyjy.com/?p=2877\" rel=\"noopener noreferrer\" target=\"_blank\">http://www.tkzyjy.com/?p=2877\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>→ 整校托管\u003cstrong>已有多个地区试点\u003c/strong>,主流的合规框架是\"三不变 + 三分开 + 政府投入不变\"。\u003c/p>\n\u003chr/>\n\u003ch2 id=\"_8\">任务三 · 行业规模数据(教育部 + 人社部分口径)\u003c/h2>\n\u003ch3 id=\"_9\">要点结论\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>教育部口径\u003c/strong>:2024 年全国中等职业学校 \u003cstrong>6862 所\u003c/strong>(较 2023 年减少 223 所),在校生 \u003cstrong>1229.33 万人\u003c/strong>。\u003cstrong>公办 vs 民办比例约 7:3\u003c/strong>:民办中职 2100 所(30.60%)、在校生 244.18 万人(19.86%)——\u003cstrong>民办在校生占比明显低于民办学校数占比,说明民办单体规模偏小\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>技工学校口径\u003c/strong>(人社部,独立于教育部):2024 年末全国技工院校 \u003cstrong>2440 所\u003c/strong>,在校生 \u003cstrong>428.7 万人\u003c/strong>,毕业生就业率 97%——\u003cstrong>全国中职+技工实际规模约 7085+2440=9525 所、1658 万人\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>职普比政策已实质松动\u003c/strong>:\"职普大体相当\"原本是国家要求,2024-2025 年多地(陕西 69%、吉林 73.4%、江苏镇江市 65% 起步)反向扩大普高比例;2024 年 9 月全国教育大会后教育部改提\"少而精的中等职业教育\"——\u003cstrong>中职招生规模面临长期收缩压力\u003c/strong>,这是托管业务最大的宏观风险。\u003c/li>\n\u003cli>\u003cstrong>生均经费标准\u003c/strong>:中央财政统一按每生每年平均 \u003cstrong>2000 元\u003c/strong>测算免学费补助(西 8:2、中 6:4、东按省);地方再叠加。各地生均公用经费折算差异大:云南南华县 900 元/生/年,陕西临潼市级 1600 元/生/年,广西县属中上公立 1500 元/生/年。\u003c/li>\n\u003cli>\u003cstrong>未找到\u003c/strong>:统一的\"中职生均经费国家标准\"——只有免学费补助标准(2000 元/生/年),生均公用经费由各省自行制定。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"_10\">关键数据表(均标注口径与年份)\u003c/h3>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>2023 年\u003c/th>\n\u003cth>2024 年\u003c/th>\n\u003cth>出处/口径\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>全国中职学校数\u003c/td>\n\u003ctd>7085 所\u003c/td>\n\u003ctd>6862 所\u003c/td>\n\u003ctd>教育部统计公报,口径:经县级以上人民政府教育部门批准设立的中职,\u003cstrong>不含技工\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中职招生数\u003c/td>\n\u003ctd>454.04 万人\u003c/td>\n\u003ctd>418.33 万人\u003c/td>\n\u003ctd>同上,降幅 7.85%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中职在校生数\u003c/td>\n\u003ctd>1298.46 万人\u003c/td>\n\u003ctd>1229.33 万人\u003c/td>\n\u003ctd>同上,降幅 5.32%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中职毕业生数\u003c/td>\n\u003ctd>415.45 万人\u003c/td>\n\u003ctd>415.55 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中职专任教师\u003c/td>\n\u003ctd>73.48 万人\u003c/td>\n\u003ctd>72.94 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>民办中职学校数\u003c/td>\n\u003ctd>2128 所(30.04%)\u003c/td>\n\u003ctd>2100 所(30.60%)\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>民办中职在校生\u003c/td>\n\u003ctd>266.44 万人(20.52%)\u003c/td>\n\u003ctd>244.18 万人(19.86%)\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通高中招生\u003c/td>\n\u003ctd>967.80 万人\u003c/td>\n\u003ctd>1036.20 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通高中在校生\u003c/td>\n\u003ctd>2803.63 万人\u003c/td>\n\u003ctd>2922.28 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中职:普高 招生比\u003c/td>\n\u003ctd>46.9:53.1\u003c/td>\n\u003ctd>40.4:59.6\u003c/td>\n\u003ctd>计算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技工院校数\u003c/td>\n\u003ctd>2440 所\u003c/td>\n\u003ctd>2440 所\u003c/td>\n\u003ctd>人社部 2024 年度公报\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技工在校生\u003c/td>\n\u003ctd>428.7 万人\u003c/td>\n\u003ctd>428.7 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技工招生数\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>157.2 万人\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技工就业率\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>97%\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>来源(一手·统计):\n- 教育部 2023 年统计公报:\u003ca href=\"https://www.moe.gov.cn/jyb_sjzl/sjzl_fztjgb/202410/t20241024_1159002.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_sjzl/sjzl_fztjgb/202410/t20241024_1159002.html\u003c/a>\n- 教育部 2024 年统计公报:\u003ca href=\"https://www.moe.gov.cn/jyb_sjzl/sjzl_fztjgb/202506/t20250611_1193760.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_sjzl/sjzl_fztjgb/202506/t20250611_1193760.html\u003c/a>\n- 人社部 2024 年度事业发展统计公报:\u003ca href=\"http://114.255.111.133/SYrlzyhshbzb/zwgk/szrs/tjgb/202506/W020250616518526345602.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">http://114.255.111.133/SYrlzyhshbzb/zwgk/szrs/tjgb/202506/W020250616518526345602.pdf\u003c/a>\n- 技工院校补充:\u003ca href=\"https://www.mohrss.gov.cn/wap/xw/rsxw/202510/t20251020_560617.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.mohrss.gov.cn/wap/xw/rsxw/202510/t20251020_560617.html\u003c/a>\u003c/p>\n\u003ch3 id=\"_11\">职普比政策演变\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>国家层面\u003c/strong>:2019 年《国家职业教育改革实施方案》要求\"\u003cstrong>保持高中阶段教育职普比大体相当\u003c/strong>\"。\u003c/li>\n\u003cli>\u003cstrong>2024 年转折\u003c/strong>:9 月全国教育大会后,教育部部长怀进鹏改提\"少而精的中等职业教育\"。陕西 2024 年普高招生 69.19%、吉林 73.4%、江苏 65%、山东等已逐步突破\"5:5\"。\u003c/li>\n\u003cli>来源(二手/机构):南方网 \u003ca href=\"https://static.nfnews.com/content/202412/06/c10317725.html;镇坪县/济宁市/镇江市地方政府答复(一手·政府):https://www.zhp.gov.cn/UploadFiles/akjyhfj63/file/20250911/20250911140419_2393.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">https://static.nfnews.com/content/202412/06/c10317725.html;镇坪县/济宁市/镇江市地方政府答复(一手·政府):https://www.zhp.gov.cn/UploadFiles/akjyhfj63/file/20250911/20250911140419_2393.pdf\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_12\">财政/生均经费(免学费政策口径)\u003c/h3>\n\u003cul>\n\u003cli>财政部、教育部、人社部 2009 年《中等职业学校免学费补助资金管理办法》(一手·法规,仍在执行):中央财政按每生每年平均 \u003cstrong>2000 元\u003c/strong>测算,与地方按比例分担(西 8:2、中 6:4、东分省);一、二年级因免学费产生缺口由财政补,三年级原则上不予补助(由学校通过校企合作和顶岗实习收入弥补)。\u003c/li>\n\u003cli>民办中职:按当地同类型同专业公办中职标准补助,高出部分可向学生收取。\u003c/li>\n\u003cli>\u003cstrong>拨付路径\u003c/strong>:从中央/省财政通过转移支付拨至县财政 → 拨至学校,\u003cstrong>未进入企业账户\u003c/strong>。这意味着托管方获取生均经费的合法路径,要么通过托管合同中约定的\"管理服务费\"\"品牌使用费\",要么通过政府购买服务获得。\u003c/li>\n\u003cli>来源(一手·法规转载):\u003ca href=\"https://baike.baidu.com/view/2878599.htm\" rel=\"noopener noreferrer\" target=\"_blank\">https://baike.baidu.com/view/2878599.htm\u003c/a>\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2 id=\"vs\">任务四 · 职教托管玩家清单(整校托管 vs 专业共建/校企合作)\u003c/h2>\n\u003ch3 id=\"_13\">要点结论\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>真正做整校托管的企业极少\u003c/strong>:目前全国\u003cstrong>真正做\"公办职业院校整建制托管\"\u003c/strong>的可识别玩家不超过 5 家,且其中以\u003cstrong>\"高职托管中职\"\"公办校托管民办校\"\u003c/strong>两类居多。\u003c/li>\n\u003cli>\u003cstrong>绝大多数上市公司做的是\"专业共建\"\"产业学院\"\"订单培养\"\"技能培训\",不是整校托管\u003c/strong>——后者门槛(资质、政府关系、组织管理)和单校投资体量都高得多。\u003c/li>\n\u003cli>\u003cstrong>头部玩家\u003c/strong>(按\"是否做过整校托管\"+\"信源可信度\"排序):\n   - \u003cstrong>天坤教育(优蓝国际旗下,企业自述)\u003c/strong>:全国首创\"TOT 政企合作办学\",公办托管 30+所(安徽 80+、四川/甘肃/河南多所),规模宣称合作院校 200+、人才服务案例 50 万+。\n   - \u003cstrong>厦门倍凡教育管理\u003c/strong>(企业自述 + 上市公告):公办托管为主营业务,2019-2020 披露\"已管理 26 所中高职院校、18 万生源\"(科斯伍德收购公告披露)。2020 年被 A 股科斯伍德(300192)拟收购未成。\n   - \u003cstrong>云南机电职业技术学院\u003c/strong>(公办高职,一手·政府):托管云南东川区职教中心 12 年,被誉为\"东川模式\",被《中国教育报》报道为\"全国首份县域职教整建制托管协议\"。\n   - \u003cstrong>新疆农职院\u003c/strong>(公办高职,一手·政府):整体托管洛浦县中职 4 轮 7 年。\u003c/li>\n\u003cli>\u003cstrong>港股/中概职教上市公司\u003c/strong>(中公教育、开元教育、东软教育、希望教育、中国东方教育、中教控股、宇华教育)\u003cstrong>均无\"整校托管公办中职\"先例\u003c/strong>,主要业务是产业学院、专业共建、订单培养、上市民办校的运营——\u003cstrong>与\"公办整校托管\"模式不同\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>核心区分\u003c/strong>:整校托管需要(1)地方党政一把手拍板;(2)\"三不变\"框架;(3)派出校长和核心管理团队;(4)承担改造投入(数千万到数亿);(5)合作期通常 10-30 年。\u003cstrong>专业共建只是卖课程/实训设备/招生服务\u003c/strong>,门槛和单校投资差距在 1-2 个数量级。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"_14\">主要玩家清单\u003c/h3>\n\u003ch4 id=\"41\">4.1 真正做\"整校托管\"的玩家\u003c/h4>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>玩家\u003c/th>\n\u003cth>模式\u003c/th>\n\u003cth>公办托管规模\u003c/th>\n\u003cth>信源与可信度\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>天坤教育(优蓝国际)\u003c/strong>\u003c/td>\n\u003ctd>\"TOT 政企合作办学\",与中西部政府签约托管公办中职\u003c/td>\n\u003ctd>公办合作 30+所,合作院校总数 200+\u003c/td>\n\u003ctd>企业自述:tkzyjy.com;优蓝国际:ylnews.cn。规模口径有自述成分。\u003cstrong>评级:企业自述,需现场尽调验证\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>厦门倍凡教育管理\u003c/strong>\u003c/td>\n\u003ctd>\"国有公办民营\"托管,以\"三不变+三分开\"框架\u003c/td>\n\u003ctd>2020 年披露 26 所中高职、18 万生源,2020 年目标 22 万\u003c/td>\n\u003ctd>A 股科斯伍德拟收购公告披露(一手·上市公司公告):\u003ca href=\"https://finance.sina.cn/2020-08-04/detail-iivhuipn6684255.d.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://finance.sina.cn/2020-08-04/detail-iivhuipn6684255.d.html\u003c/a>。\u003cstrong>评级:有公开披露,可信度较好\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>云南机电职业技术学院(公办高职)\u003c/strong>\u003c/td>\n\u003ctd>高职托管县域中职,\"东川模式\"\u003c/td>\n\u003ctd>1 所(东川职中),12 年长期实践\u003c/td>\n\u003ctd>《中国教育报》、云南机电职业技术学院成果简介(一手·政府).\u003cstrong>评级:一手,公办机构示范\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>新疆农职院(公办高职)\u003c/strong>\u003c/td>\n\u003ctd>整体托管洛浦县中职 4 轮\u003c/td>\n\u003ctd>1 所,7 年长期实践\u003c/td>\n\u003ctd>人民日报(一手·央媒).\u003cstrong>评级:一手\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>新领航教育科技集团\u003c/strong>(案例·作负面)\u003c/td>\n\u003ctd>假借合作办学名义招生\u003c/td>\n\u003ctd>无合法整校托管\u003c/td>\n\u003ctd>国务院第七次大督查通报(一手·国务院):\u003ca href=\"https://js.people.com.cn/n2/2020/1106/c360307-34399501.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://js.people.com.cn/n2/2020/1106/c360307-34399501.html\u003c/a>。\u003cstrong>评级:反面案例,2020 年被取消招生资格\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch4 id=\"42\">4.2 上市公司中\"做产教融合但不做整校托管\"的公司\u003c/h4>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>公司(股票代码)\u003c/th>\n\u003cth>主营业务\u003c/th>\n\u003cth>是否做整校托管\u003c/th>\n\u003cth>信源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>中公教育(002607.SZ)\u003c/td>\n\u003ctd>职业培训(公考、教资、IT);2021 起设职教事业部,做产业学院、专业共建、产教融合\u003c/td>\n\u003ctd>\u003cstrong>未做整校托管\u003c/strong>;披露的合作集中在本科/大专/中专的\"产业学院\"共建(湖南、湖北、安徽)\u003c/td>\n\u003ctd>二手:中国经济网 \u003ca href=\"https://finance.ce.cn/stock/gsgdbd/202303/03/t20230303_38423895.shtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://finance.ce.cn/stock/gsgdbd/202303/03/t20230303_38423895.shtml\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中国东方教育(00667.HK)\u003c/td>\n\u003ctd>自营连锁职业技能培训(新东方烹饪、新华电脑、万通汽车等 7 大品牌),234 所学校\u003c/td>\n\u003ctd>\u003cstrong>不做整校托管\u003c/strong>;主要是自营 + 与比亚迪、奇瑞、费大廚等定向班\u003c/td>\n\u003ctd>一手:百度百科/财报;人民网安徽频道 \u003ca href=\"https://ah.people.com.cn/BIG5/n2/2025/0407/c358324-41188208.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://ah.people.com.cn/BIG5/n2/2025/0407/c358324-41188208.html\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>开元教育(300338.SZ)\u003c/td>\n\u003ctd>财经、IT 培训\u003c/td>\n\u003ctd>\u003cstrong>未做整校托管\u003c/strong>\u003c/td>\n\u003ctd>二手:光大证券点评 \u003ca href=\"https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/628964049075/index.phtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/628964049075/index.phtml\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>东软教育(9616.HK)\u003c/td>\n\u003ctd>民办 IT 本科(大连、成都、广东三所民办学院),非学历培训\u003c/td>\n\u003ctd>\u003cstrong>未做公办中职整校托管\u003c/strong>\u003c/td>\n\u003ctd>二手:同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>希望教育(01765.HK)/中教控股(00839.HK)/新高教(02001.HK)/中汇集团(00382.HK)/中国科培(01890.HK)/中国新华教育(02779.HK)/宇华教育(06169.HK)\u003c/td>\n\u003ctd>民办高校运营\u003c/td>\n\u003ctd>\u003cstrong>未做公办整校托管\u003c/strong>;主营业务是自有/收购民办本科/大专\u003c/td>\n\u003ctd>二手:同上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003ch4 id=\"43\">4.3 国资或地方政府体系内的\"准托管\"形态\u003c/h4>\n\u003cul>\n\u003cli>\u003cstrong>市域产教联合体 / 行业产教融合共同体\u003c/strong>(2022 中办国办文件):政府+企业+学校+科研机构共建理事会,实体化运作。这不是单一企业做\"整校托管\",而是政府主导的多方合作机制。\u003c/li>\n\u003cli>\u003cstrong>职教集团\u003c/strong>:截至 2022 年 8 月,全国建成职教集团 1500+个,联系企业 3 万+家(教育部公开数据)。职教集团是松散型联盟,\u003cstrong>不是整校托管\u003c/strong>。\u003c/li>\n\u003cli>来源(一手·政府):教育部对人大第 6650 号建议答复 \u003ca href=\"https://www.moe.gov.cn/jyb_xxgk/xxgk_jyta/jyta_zcs/202401/t20240102_1097482.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_xxgk/xxgk_jyta/jyta_zcs/202401/t20240102_1097482.html\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_15\">信源分类小结\u003c/h3>\n\u003cul>\n\u003cli>企业自述(评级需打折):天坤/优蓝、倍凡、中国东方教育网站\u003c/li>\n\u003cli>一手·政府(可信度高):江西省教育厅、人民日报、《中国教育报》\u003c/li>\n\u003cli>二手(口径因品牌):光大证券、九方智投、人民网频道\u003c/li>\n\u003cli>反面教材(背景合规风险):南京交通科技学校、新领航、长沙县益立、盐城技师学院\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2 id=\"_16\">任务五 · 政策风险扫描\u003c/h2>\n\u003ch3 id=\"_17\">要点结论\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>实习合规是托管业务最大风险点\u003c/strong>:教育部等八部门 2021 年修订的《职业学校学生实习管理规定》(教职成〔2021〕4 号)划定 \u003cstrong>1 个\"严禁\"+ 27 个\"不得\"\u003c/strong>,明确\u003cstrong>禁止学校和实习单位向学生收取押金、培训费、报酬提成、管理费、实习材料费、就业服务费\u003c/strong>——托管方\u003cstrong>不能从学生实习人头费中获益\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>托管方可以从\u003c/strong>生别工资\u003cstrong>中获益\u003c/strong>:实习报酬按月足额发放给学生,原则上不低于实习单位相同岗位试用期工资标准的 80%——托管方收益须通过合规的管理服务费、品牌使用费、就业服务费(对 B 端企业)等明路径\u003cstrong>而非人头抽佣\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>公办中职资产\u003c/strong>较为稳定:免学费补助(中央 2000 元/生/年 + 地方配套)\u003cstrong>拨至学校\u003c/strong>,不直接进入企业账户;托管方合同须接受审计;公办教师身份保留是\"三不变\"硬约束。\u003c/li>\n\u003cli>\u003cstrong>公办中职党的领导约束\u003c/strong>:新法第三十五条\"\u003cstrong>公办职业学校实行中国共产党职业学校基层组织领导的校长负责制\u003c/strong>\"——托管方只能派\"执行校长\",党组织书记由市委任命,\u003cstrong>重大事项必须经党委决策\u003c/strong>,托管方的实际控制权受党组织把关。\u003c/li>\n\u003cli>\u003cstrong>历史风险案例\u003c/strong>:已有南京交通科技学校(2020 国务院通报)、桂林市舞蹈学校(2007)、盐城技师学院(2021)、湖南龙翔中职(2024)等违规事件被处罚/通报——多为\u003cstrong>违规招生、虚假宣传、强制实习、收人头费、违规收费\u003c/strong>等,均为托管业务的\u003cstrong>反面警示\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"_18\">关键法规摘录\u003c/h3>\n\u003ch4 id=\"51-20214\">5.1 实习管理规定(教职成〔2021〕4 号,一手·法规)\u003c/h4>\n\u003cp>来源:教育部 2022-01 联合印发;全文见 \u003ca href=\"https://www.moe.gov.cn/jyb_xwfb/gzdt_gzdt/s5987/202201/t20220121_595541.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.moe.gov.cn/jyb_xwfb/gzdt_gzdt/s5987/202201/t20220121_595541.html\u003c/a> 及央广网全文转载 \u003ca href=\"https://www.cnr.cn/jr/jr/20220122\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.cnr.cn/jr/jr/20220122\u003c/a>\u003c/p>\n\u003cp>关键条款:\n- \u003cstrong>第二条\u003c/strong>:实习包括\"认识实习\"和\"岗位实习\"(已统一原\"跟岗实习\"\"顶岗实习\")。\n- \u003cstrong>第十五条\u003c/strong>:未满 \u003cstrong>16 周岁\u003c/strong>的中职学生不得安排顶岗实习;不得安排学生加班和夜班(法定节假日实习亦不得安排;特殊专业如护理/导游/煤炭井下可调整)。\n- \u003cstrong>第十七条\u003c/strong>:实习报酬\"原则上不低于本单位相同岗位试用期工资标准的 \u003cstrong>80%\u003c/strong>;按月足额发放,不得拖欠;以\u003cstrong>货币\u003c/strong>方式发放,不得以代金券、实物替代。\"\n- \u003cstrong>第十九条\u003c/strong>:\"职业学校和实习单位\u003cstrong>不得向学生收取实习押金、培训费、实习报酬提成、管理费、实习材料费、就业服务费或者其他形式的实习费用\u003c/strong>,不得要求学生提供担保或者以其他名义收取学生财物。\"\n- \u003cstrong>第二十六条\u003c/strong>:岗位实习须签订\u003cstrong>统一的三方协议\u003c/strong>(学校 + 实习单位 + 学生),并附示范文本。\n- \u003cstrong>跨省实习\u003c/strong>:须事先经学校主管部门同意,按程序报省级主管部门备案。\u003c/p>\n\u003cp>→ \u003cstrong>结论\u003c/strong>:托管方不能通过\"实习人头费\"获利,所有实习收费均被封死。实习是合规风险最高的环节。\u003c/p>\n\u003ch4 id=\"52\">5.2 公办职业学校党的领导(新法第三十五条,一手·法规)\u003c/h4>\n\u003cblockquote>\n\u003cp>\"公办职业学校实行中国共产党职业学校基层组织领导的校长负责制……民办职业学校依法健全决策机制,强化学校的中国共产党基层组织政治功能,保证其在学校重大事项决策、监督、执行各环节有效发挥作用。\"\u003c/p>\n\u003c/blockquote>\n\u003cp>→ 托管方在公办校\u003cstrong>只有\"管理经营权\",没有\"办学决策权\"\u003c/strong>,实际办学决策权在学校党委。这是与 K12 托管最大的治理差异。\u003c/p>\n\u003ch4 id=\"53\">5.3 历史风险案例汇总\u003c/h4>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时间\u003c/th>\n\u003cth>案例\u003c/th>\n\u003cth>违规点\u003c/th>\n\u003cth>处理\u003c/th>\n\u003cth>信源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>2007\u003c/td>\n\u003ctd>桂林市舞蹈中等职业学校\u003c/td>\n\u003ctd>安排未成年学生在营业性娱乐场所实习、强迫陪酒、收实习押金、提管理费、未满 16 周岁实习\u003c/td>\n\u003ctd>吊销办学许可证\u003c/td>\n\u003ctd>教育部办公厅通报:\u003ca href=\"https://jyt.ah.gov.cn/places/zyycrjyc/tzgg/39858858.html\" rel=\"noopener noreferrer\" target=\"_blank\">https://jyt.ah.gov.cn/places/zyycrjyc/tzgg/39858858.html\u003c/a> (一手)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2020.11\u003c/td>\n\u003ctd>南京交通科技学校 + 新领航公司\u003c/td>\n\u003ctd>2018 起多次被取消招生资格;借合作办学名义违规招生 3 年;无证教师 37 人\u003c/td>\n\u003ctd>国务院第七次大督查通报,主管部门被问责\u003c/td>\n\u003ctd>中国政府网/央视:\u003ca href=\"https://news.cctv.com/2020/11/06/ARTIDF5wDcjPttoiLvGQVMYU201106.shtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://news.cctv.com/2020/11/06/ARTIDF5wDcjPttoiLvGQVMYU201106.shtml\u003c/a> (一手)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2021.05\u003c/td>\n\u003ctd>盐城技师学院\u003c/td>\n\u003ctd>强制学生到指定工厂实习、不实习不发毕业证、涉嫌赚取\"人头费\"、劳务中介参与实习管理\u003c/td>\n\u003ctd>涉事二级学院院长调离,纪检监察介入,削减招生计划\u003c/td>\n\u003ctd>央广网:\u003ca href=\"https://china.cnr.cn/gdgg/20210518/t20210518_525489592.shtml\" rel=\"noopener noreferrer\" target=\"_blank\">https://china.cnr.cn/gdgg/20210518/t20210518_525489592.shtml\u003c/a> (一手)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2024.03\u003c/td>\n\u003ctd>湖南龙翔中等职业技术学校\u003c/td>\n\u003ctd>文艺专业学生被安排到广东惠州工厂流水线实习(专业不对口)\u003c/td>\n\u003ctd>冷水滩区教育局通报批评、退费、减计划\u003c/td>\n\u003ctd>人民日报:\u003ca href=\"https://www.peopleapp.com/rmharticle/30021332192\" rel=\"noopener noreferrer\" target=\"_blank\">https://www.peopleapp.com/rmharticle/30021332192\u003c/a> (一手·央媒)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2024\u003c/td>\n\u003ctd>长沙县益立中等职业技术学校(举报)\u003c/td>\n\u003ctd>一刀切禁止自主实习、强制统一实习、不跟校不发毕业证\u003c/td>\n\u003ctd>市教育局已回应,正在处理\u003c/td>\n\u003ctd>红网问政:\u003ca href=\"https://wz.rednet.cn/front/messages/detail?id=1020458\" rel=\"noopener noreferrer\" target=\"_blank\">https://wz.rednet.cn/front/messages/detail?id=1020458\u003c/a> (一手·政府回复)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp>→ \u003cstrong>共同违规模式\u003c/strong>:①违规招生(虚假宣传、超计划、与中介合作);②强制实习(与专业不对口、超时、超龄);③收人头费/管理费/押金;④无证教师。\u003cstrong>所有这些都是托管方可能被地方监管的口径\u003c/strong>。\u003c/p>\n\u003chr/>\n\u003ch2 id=\"_19\">我没找到的东西(显式列出,避免误读)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>《职业教育法》本身没有\"委托管理\"或\"政府购买服务\"的对应文字\u003c/strong>——整校托管的合法依据在国发〔2014〕19 号《国务院关于加快发展现代职业教育的决定》,而非新职教法。\u003c/li>\n\u003cli>\u003cstrong>全国统一的\"中职学校委托管理\"程序文件或管理办法不存在\u003c/strong>——只有地方实践,中央未出台专门规定。这意味着跨区域复制时,\u003cstrong>每个地方政府都是独立谈判对手\u003c/strong>,合规框架需逐地确认。\u003c/li>\n\u003cli>\u003cstrong>统一的\"中职生均经费国家标准\"未找到\u003c/strong>——只有中央财政的免学费补助标准(2000 元/生/年)。生均公用经费、生均仪器设备值由各省自定,差异大。\u003c/li>\n\u003cli>\u003cstrong>托管方从\"学生人头经费\"中分成的明确路径未找到\u003c/strong>——免学费补助直接拨至学校,托管方只能通过合同约定的管理服务费、就业服务费、产业学院收费、自办企业利润等明路径获益。\u003c/li>\n\u003cli>\u003cstrong>天坤教育、优蓝国际、倍凡教育的真实营收/利润数据\u003c/strong>——三家均未上市或仅在 A 股收购公告中披露片段;规模口径多为企业自述,需现场尽调验证。\u003c/li>\n\u003cli>\u003cstrong>2025 年的中职最新统计\u003c/strong>——人社部 2024 年度公报为最新;教育部 2025 年公报(对应 2025 学年数据)尚未发布。\u003c/li>\n\u003cli>\u003cstrong>国家层面\"产教融合型企业\"名单中,获得\"金融+财政+土地+信用\"组合激励的职教托管企业名单\u003c/strong>——发改委、教育部 2019 年印发《建设产教融合型企业实施办法(试行)》(发改社会〔2019〕590 号),但\u003cstrong>国家认证目录的公开披露有限\u003c/strong>,企业自报为主。\u003c/li>\n\u003cli>\u003cstrong>公办中职托管业务的\"关联交易禁止\"红线\u003c/strong>——明确\"未找到\"。民促法实施条例第 13/45 条红线\u003cstrong>只针对义务教育 + 非营利学前\u003c/strong>,不约束中职托管。但托管方仍受民促法第三十二条\"不得以管理费等方式取得或者变相取得办学收益\"约束(此条针对公办学校参与举办非营利性民办学校,\u003cstrong>不直接针对公办校本身\u003c/strong>)。\u003c/li>\n\u003cli>\u003cstrong>\"少而精的中等职业教育\"具体落地政策\u003c/strong>——2024 年 9 月全国教育大会后提出,但教育部《三年行动计划》尚未公开发布。\u003c/li>\n\u003cli>\u003cstrong>全国统一的\"职普比\"硬性要求\u003c/strong>——2019 年提\"大体相当\"后,2024-2025 年已实质松动,但\u003cstrong>没有废止或调整的国家级正式文件\u003c/strong>;多地自主调整。\u003c/li>\n\u003c/ol>\n\u003chr/>\n\u003ch2 id=\"_20\">关键结论(对\"职教托管这门生意\"的判断)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>政策合法性强于 K12 托管,但\u003c/strong>没有协议控制\u003cstrong>红线 — K12 阶段禁协议控制+禁关联交易+禁义务教育营利;中职阶段\u003c/strong>所有这些都放开了\u003cstrong>,公办职业院校可以资本参与、协议控制、营利。这是\u003c/strong>职教托管相对于 K12 的政策套利空间**。\u003c/li>\n\u003cli>\u003cstrong>市场规模在收缩\u003c/strong>:中职招生（教育部口径·不含技工）2021 488.99 → 2022 484.78 → 2023 454.04 → 2024 418.33 万，三年降 14.5%；按 2019 同口径（457.42 万）算五年降 8.5%（\u003cstrong>注：早期\"30%\"系混了含技工/不含技工口径，2026-10-14 修正\u003c/strong>）。在校生 1576 万→1229 万、五年 -22%；学校数 10100→6862、五年 -32%。\u003cstrong>未来 5-10 年中职仍是缩量市场\u003c/strong>,托管业务的核心逻辑是\u003cstrong>\"替代政府职能,降本增效\"\u003c/strong>而非规模扩张。\u003c/li>\n\u003cli>\u003cstrong>玩家极度分散,头部未定型\u003c/strong>——真正做整校托管的天润/倍凡规模约 30 所上下,且多在县级公办校,\u003cstrong>没有出现绝对头部\u003c/strong>。港股/A 股上市公司基本都没进这一赛道(被政策风险和重资产吓退),这是\u003cstrong>留给 AI SaaS 企业的窗口\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>生均经费\"看得到摸不着\"\u003c/strong>——公办财政补助进入学校账户,托管方合法分成路径只有管理服务费/就业服务费/产业学院等;\u003cstrong>不能从学生人头经费中抽成\u003c/strong>(这是过去很多托管公司暴雷的根因)。\u003c/li>\n\u003cli>\u003cstrong>实习合规是死穴\u003c/strong>——任何\"实习中介费\"\"实习管理费\"\"实习人头提成\"都属于违规收费,\u003cstrong>必须在合同中明确割除为正题\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>党的领导是天花板\u003c/strong>——党组织决定的校长负责制,意味着托管方派出的\"执行校长\"在重大事项上必须服从党委,\u003cstrong>实际控制权远不如教育服务合同表面的授权\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003chr/>\n\u003cp>\u003cem>报告字数:约 4800 字。所有数据带年份+口径+链接;所有法条带文件名+条号+原文摘录或来源链接;未找到项已单列。\u003c/em>\u003c/p>\u003csection class=\"material-sources\">\u003ch2>本材料来源入口\u003c/h2>\u003cul>\u003cli>来源见正文及全库来源明细。\u003c/li>\u003c/ul>\u003c/section>\u003c/main>\u003c/div>\u003c/body>\u003c/html>","status":"历史研究底稿","notice":"历史底稿：其中“优蓝未上市、无公开财务数据”的旧判断已被核验校正版纠正。请先看“核验校正版”；本页保留原始文本供对照。"},{"id":"L52","label":"历史简报","title":"快速情报简报 · 职业教育托管这门生意（样本：优蓝国际 YOUL.US）","href":"../materials/L52.html","html":"\u003c!DOCTYPE html>\n\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n\u003ctitle>快速情报简报 · 职业教育托管这门生意（样本：优蓝国际 YOUL.US）\u003c/title>\n\u003cstyle>\n  :root{\n    --ink:#1a2332; --ink2:#4a5568; --ink3:#8494a8;\n    --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef;\n    --accent:#1f5fa8; --accent-bg:#eaf2fb;\n    --red:#c0392b; --red-bg:#fdecea;\n    --amber:#b7791f; --amber-bg:#fdf3e3;\n    --green:#1e7e4d; --green-bg:#e8f6ef;\n    --purple:#6b46c1; --purple-bg:#f0eafc;\n    --mono:\"SF Mono\",Menlo,Consolas,monospace;\n  }\n  *{margin:0;padding:0;box-sizing:border-box}\n  body{font-family:-apple-system,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}\n  .wrap{max-width:1140px;margin:0 auto;padding:32px 24px 80px}\n  header.report-head{background:linear-gradient(135deg,#14324f 0%,#1f5fa8 100%);color:#fff;border-radius:16px;padding:38px 42px;margin-bottom:22px}\n  header.report-head .tag{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:2px 14px;font-size:12px;letter-spacing:1px;margin-bottom:14px}\n  header.report-head h1{font-size:26px;line-height:1.4;margin-bottom:10px}\n  header.report-head p.sub{opacity:.9;font-size:13.5px;max-width:900px}\n  header.report-head .meta{margin-top:16px;font-size:12.5px;opacity:.75;font-family:var
